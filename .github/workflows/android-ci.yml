name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MotoLink
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check 16 KiB ELF and APK ZIP alignment for all 64-bit native libraries
        run: python3 scripts/check_android_16kb.py app/build/outputs/apk/debug/app-debug.apk

      - name: Build unsigned release App Bundle for Play compatibility
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Check App Bundle declares PAGE_ALIGNMENT_16K
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/bundletool-all.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          java -jar /tmp/bundletool-all.jar dump config \
            --bundle=app/build/outputs/bundle/release/app-release.aab | tee /tmp/motolink_bundle_config.txt
          grep -q 'PAGE_ALIGNMENT_16K' /tmp/motolink_bundle_config.txt

# Questo workflow verifica che MotoLink compili correttamente.
# Usa un runner standard ubuntu-latest su repository pubblico.
# Non carica artefatti e non contiene né utilizza keystore, password
# o credenziali di firma release.
