name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MotoLink
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Research branch only. The production workflow on main does not retain APK artifacts.
      - name: Upload Maps diagnostic APK
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/maps-notification-diagnostic-v1'
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink-Maps-Notification-Diagnostic
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

# Questo workflow verifica che MotoLink compili correttamente.
# Il ramo diagnostico Maps conserva per 1 giorno soltanto l'APK DEBUG di test.
# Non contiene né utilizza keystore, password o credenziali di firma release.
