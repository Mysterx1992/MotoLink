name: MotoLink V1.4 R7 Physical Fix Build

on:
  push:
    branches: [ "v1.4-cfmoto-build" ]

permissions:
  contents: read

jobs:
  build:
    name: Build MotoLink V1.4 r7 unsigned release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply isolated V1.4 r7 patches
        run: python3 .github/scripts/patch_v14_r7.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build MotoLink V1.4 r7 release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify frozen EasyConn wire and H264 bus
        run: |
          git diff --exit-code -- \
            app/src/main/java/it/motolink/app/EasyConnDiscovery.kt \
            app/src/main/java/it/motolink/app/EasyConnInitClient.kt \
            app/src/main/java/it/motolink/app/EasyConnServers.kt \
            app/src/main/java/it/motolink/app/H264FrameBus.kt

      - name: Verify V1.4 r7 markers
        run: |
          grep -q 'versionCode = 7' app/build.gradle.kts
          grep -q 'versionName = "1.4"' app/build.gradle.kts
          grep -q 'CFMOTO ROTATION V1.4' app/src/main/java/it/motolink/app/MirrorService.kt
          grep -q 'SESSION REATTACH V1.4' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -q 'Software caused connection abort' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -q 'HOTSPOT V1.4' app/src/main/java/it/motolink/app/BikeNetworkConnector.kt

      - name: Stage unsigned APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk MotoLink_V1.4_UNSIGNED_R7.apk

      - name: Upload V1.4 r7 unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.4_UNSIGNED_R7
          path: MotoLink_V1.4_UNSIGNED_R7.apk
          if-no-files-found: error
