name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MotoLink
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check 16 KiB ELF and APK ZIP alignment for all 64-bit native libraries
        run: python3 scripts/check_android_16kb.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify isolated test package identity and archive checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/motolink_test_badging.txt
          grep -Fq "package: name='it.motolink.app.bletest'" /tmp/motolink_test_badging.txt
          grep -Fq "application-label:'MotoLink BLE TEST'" /tmp/motolink_test_badging.txt
          sha256sum "$APK" | tee "${APK}.sha256"

      - name: Upload isolated MotoLink TEST installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1_8_BLE_RESYNC_TEST_DEBUG_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Audit MediaProjection foreground service and Google Maps notification contract
        run: python3 scripts/check_play_permissions.py

      - name: Audit overlay permission and internet/LAN network policy
        run: python3 scripts/check_play_overlay_network.py

      - name: Audit anonymous-session deletion and public privacy documentation
        run: python3 scripts/check_privacy_deletion_contract.py

      - name: Audit BLE navigation active-notification resync and stale-data safeguards
        run: python3 scripts/check_ble_navigation_resync.py

      - name: Parse manual disposable-user PowerShell test without executing
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/test_supabase_delete_disposable.ps1).Path,
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PASS: syntax-only PowerShell disposable account test'

      - name: Set up Deno for offline Supabase deletion tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check anonymous-session deletion Edge Function
        run: deno check supabase/functions/motolink-delete-session/index.ts

      - name: Synthetic Supabase deletion tests (NO production access)
        run: deno test --no-remote supabase/functions/motolink-delete-session/handler_test.ts

      - name: Build unsigned release App Bundle for Play compatibility
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Check App Bundle declares PAGE_ALIGNMENT_16K
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/bundletool-all.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          java -jar /tmp/bundletool-all.jar dump config \
            --bundle=app/build/outputs/bundle/release/app-release.aab | tee /tmp/motolink_bundle_config.txt
          grep -q 'PAGE_ALIGNMENT_16K' /tmp/motolink_bundle_config.txt

# BLE NAV RESYNC TEST ONLY (PR draft): V1.8 production release untouched.
# Questo workflow verifica che MotoLink compili correttamente.
# Usa un runner standard ubuntu-latest su repository pubblico.
# Carica solo APK DEBUG con package isolato it.motolink.app.bletest,
# firmato dalla chiave DEBUG temporanea del runner per test fisici.
# Non contiene né utilizza keystore, password o credenziali di firma release.
