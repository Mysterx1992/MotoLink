name: Android CI

on:
  push:
    branches: [ "main", "feature/first-start-profile-choice-v1" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MotoLink
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply first-start profile patch
        if: github.ref == 'refs/heads/feature/first-start-profile-choice-v1'
        run: python .github/scripts/apply_first_start_profile_flow.py

      - name: Commit patched sources
        if: github.ref == 'refs/heads/feature/first-start-profile-choice-v1'
        run: |
          if git diff --quiet -- app/src/main/java/it/motolink/app/MainActivity.kt app/src/main/java/it/motolink/app/TrofeoDashboardView.kt; then
            echo "No source changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/it/motolink/app/MainActivity.kt app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
            git commit -m "Add first-start Hotspot or QR profile flow"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload first-start test APK
        if: github.ref == 'refs/heads/feature/first-start-profile-choice-v1'
        uses: actions/upload-artifact@v4
        with:
          name: motolink-first-start-profile-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
