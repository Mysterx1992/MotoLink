name: Build Trofeo 500 Diagnostic APK

on:
  push:
    branches: [ "diagnostic/trofeo500-wifi-v1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build diagnostic debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :diag-trofeo500:assembleDebug --stacktrace
      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK="diag-trofeo500/build/outputs/apk/debug/diag-trofeo500-debug.apk"
          test -f "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK")"
          echo "$BADGING" | head -n 5
          echo "$BADGING" | grep -F "package: name='it.motolink.diag.trofeo500' versionCode='2' versionName='1.0.1'"
          echo "$BADGING" | grep -F "uses-permission: name='android.permission.CHANGE_NETWORK_STATE'"
          mkdir -p out
          cp "$APK" out/Trofeo500_WIFI_BT_DIAGNOSTIC_V1_0_1.apk
          sha256sum out/Trofeo500_WIFI_BT_DIAGNOSTIC_V1_0_1.apk > out/Trofeo500_WIFI_BT_DIAGNOSTIC_V1_0_1.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Trofeo500_WIFI_BT_DIAGNOSTIC_V1_0_1
          path: out/
          if-no-files-found: error
          retention-days: 7
