name: Build MotoLink V1.6 Official Artifact

on:
  push:
    branches: [ "build/v1.6-official-candidate" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize verified V1.6 source delta
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          def materialize_b64(b64_text, output, expected_sha256):
              raw = base64.b64decode(b64_text, validate=True)
              data = gzip.decompress(raw)
              got = hashlib.sha256(data).hexdigest()
              if got != expected_sha256:
                  raise SystemExit(f"SOURCE HASH FAIL {output}: {got}")
              Path(output).parent.mkdir(parents=True, exist_ok=True)
              Path(output).write_bytes(data)
              print(f"SOURCE HASH OK {output}: {got}")

          chunks = []
          for i in range(8):
              p = Path(f"tools/v16_patch_chunks/{i:02d}.txt")
              if not p.is_file():
                  raise SystemExit(f"MISSING PATCH CHUNK {p}")
              chunks.append(p.read_text().strip())
          patch_b64 = "".join(chunks)
          if len(patch_b64) != 7428:
              raise SystemExit(f"PATCH B64 LENGTH FAIL: {len(patch_b64)}")
          materialize_b64(
              patch_b64,
              "tools/apply_v16.py",
              "56e759ba23c883314d28b9f11dc668f9d0a14409be8fae1fbb5672490a4ba4a4",
          )
          materialize_b64(
              Path("tools/V16Navigation.kt.gz.b64").read_text().strip(),
              "app/src/main/java/it/motolink/app/V16Navigation.kt",
              "4d075a026cf6d35bf567e4d8766954d4957712ae3331d3d42a3feb6eaaf974fd",
          )
          materialize_b64(
              Path("tools/V16ConnectionModeDialog.kt.gz.b64").read_text().strip(),
              "app/src/main/java/it/motolink/app/V16ConnectionModeDialog.kt",
              "7ff4f709a224a1d62a049aab521fd3bb613b1e496ae18890bf80393174303257",
          )
          PY
          python3 tools/apply_v16.py
          sed -i "/'connectionType = \\\"BLE_NAV\\\"',/d; /'connectionType = \\\"AUTOMATIC\\\"',/d" tools/apply_v16_profile_ui.py
          python3 tools/apply_v16_profile_ui.py
          python3 tools/apply_v16_garage_ui.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/apply_v16_ble_transport_and_auto_removal.py")
          s = p.read_text(encoding="utf-8")
          start = s.find("# Never let a Maps instruction enter the transport before heartbeat verification.")
          end = s.find("# A deterministic status=3 must not create the observed reconnect storm", start)
          if start < 0 or end < 0:
              raise SystemExit("BLE PATCHER NARROWING FAIL: expected optional navigation-gate block not found")
          s = s[:start] + "# Maps is opened only by onReady, which now occurs after heartbeat ACK.\n\n" + s[end:]
          p.write_text(s, encoding="utf-8")
          print("BLE PATCHER NARROWING OK: removed unsupported sendInstruction marker only")
          PY
          python3 tools/apply_v16_ble_transport_and_auto_removal.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/it/motolink/app/V16Navigation.kt")
          s = p.read_text(encoding="utf-8")
          old = "main.postDelayed(heartbeat, HEARTBEAT_INTERVAL_MS)"
          if s.count(old) != 1:
              raise SystemExit(f"BLE HEARTBEAT INTERVAL FIX FAIL: expected once, found {s.count(old)}")
          s = s.replace(old, "main.postDelayed(heartbeat, 1000L)", 1)
          p.write_text(s, encoding="utf-8")
          print("BLE HEARTBEAT INTERVAL FIX OK: 1000 ms")
          PY
          python3 tools/apply_v16_maps_maneuver_fix.py
          python3 tools/apply_v16_vc15_roundabout_ble_stability.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          if s.count("versionCode = 11") != 1:
              raise SystemExit("V1.6 BUILD CODE PATCH FAIL: expected versionCode 11 once")
          s = s.replace("versionCode = 11", "versionCode = 15", 1)
          p.write_text(s, encoding="utf-8")
          print("V1.6 BUILD CODE PATCH OK: versionCode 15, versionName unchanged")
          PY
          chmod +x ./gradlew
      - name: Verify V1.6 corrected source
        run: |
          set -euo pipefail
          MAIN="app/src/main/java/it/motolink/app/MainActivity.kt"
          NAV="app/src/main/java/it/motolink/app/V16Navigation.kt"
          STORE="app/src/main/java/it/motolink/app/BikeProfileStore.kt"

          grep -F 'text = "Connessione:"' "$MAIN"
          grep -F 'listOf("Hotspot", "QrCode", "BLE")' "$MAIN"
          ! grep -F 'listOf("Automatico", "Hotspot", "QrCode", "BLE")' "$MAIN"
          grep -F 'BikeConnectionType.AUTOMATIC -> showV16LegacyAutomaticMigrationChoice(profile)' "$MAIN"
          ! grep -F 'BikeConnectionType.AUTOMATIC -> startV16BleNavigation(profile, automatic = true)' "$MAIN"
          grep -F 'private fun showV16LegacyAutomaticMigrationChoice(profile: BikeProfile)' "$MAIN"
          grep -F 'Scegli Hotspot, QrCode oppure BLE.' "$MAIN"
          grep -F '"Hotspot", "QrCode" -> "HOTSPOT_EASYCONN"' "$MAIN"
          grep -F '"BLE" -> "BLE_NAV"' "$MAIN"
          grep -F 'private fun showBikeProfileMenu(index: Int)' "$MAIN"
          grep -F 'private fun showBikeProfileCreationDialog(' "$MAIN"
          grep -F 'fun replaceAt(context: Context, index: Int, profile: BikeProfile): Boolean' "$STORE"
          ! grep -F 'hint = "Descrizione (facoltativa)"' "$MAIN"
          ! grep -F 'V16ConnectionModeDialog.show' "$MAIN"
          test ! -f app/src/main/java/it/motolink/app/V16ConnectionModeDialog.kt

          grep -F 'val writeType = BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT' "$NAV"
          grep -F 'attendo 750 ms prima del heartbeat 0x5A di verifica' "$NAV"
          grep -F 'READY verificato dopo ACK heartbeat 0x5A status=0' "$NAV"
          grep -F 'sessione fermata senza loop di riconnessione' "$NAV"
          grep -F 'private var transportVerified = false' "$NAV"
          grep -F 'main.postDelayed(heartbeat, 1000L)' "$NAV"
          ! grep -F 'HEARTBEAT_INTERVAL_MS' "$NAV"

          grep -F 'Notification.EXTRA_SUMMARY_TEXT' "$NAV"
          grep -F 'notification.tickerText' "$NAV"
          grep -F 'nav_notification_icon' "$NAV"
          grep -F 'private fun maneuverFromIcon(bitmap: Bitmap?): NavManeuver' "$NAV"
          grep -F 'GoogleMapsSourceAdapter.parse(this, n)' "$NAV"
          grep -F 'GOOGLE_MAPS_NOTIFICATION_$sourceKind' "$NAV"
          grep -F 'source=${model.source} maneuver=${model.maneuver}' "$NAV"

          grep -F 'private fun looksLikeRoundaboutGlyph(bitmap: Bitmap, bg: Int): Boolean' "$NAV"
          grep -F 'MAPS NAV V1.6 ICON DIAG: manovra non classificata fp=' "$NAV"
          grep -F 'roadFlag = if (maneuver == NavManeuver.ROUNDABOUT) 2 else 0' "$NAV"
          grep -F 'NavManeuver.STRAIGHT, NavManeuver.ROUNDABOUT -> 1' "$NAV"

          grep -F 'private var reconnectAttempt = 0' "$NAV"
          grep -F 'gatt != null && txChar != null && transportVerified' "$NAV"
          grep -F 'callback GATT obsoleto ignorato' "$NAV"
          grep -F 'recovery -> nuova scansione BLE prima di connectGatt' "$NAV"
          grep -F 'istruzione reale disponibile ma canale TFT non ancora verificato' "$NAV"
          grep -F 'scheduleReconnect("Timeout callback GATT", forceFreshScan = true, minDelayMs = 6000L)' "$NAV"

          grep -F 'versionCode = 15' app/build.gradle.kts
          grep -F 'versionName = "1.6"' app/build.gradle.kts
      - name: Compile release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify unsigned identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK")"
          echo "$BADGING" | head -n 4
          echo "$BADGING" | grep -F "package: name='it.motolink.app' versionCode='15' versionName='1.6'"
          sha256sum "$APK" > MotoLink_V1.6_UNSIGNED.sha256
      - name: Stage local-signing tools
        run: |
          mkdir -p out/signing-tools/lib
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/MotoLink_V1.6_vc15_UNSIGNED.apk
          cp app/src/main/java/it/motolink/app/V16Navigation.kt out/GENERATED_V16Navigation_vc15.kt
          cp MotoLink_V1.6_UNSIGNED.sha256 out/
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" out/signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/signing-tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.6_vc15_UNSIGNED_AND_SIGNING_TOOLS
          path: out/
          if-no-files-found: error
          retention-days: 2
