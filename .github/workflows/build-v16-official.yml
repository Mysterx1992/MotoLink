name: Build MotoLink V1.6 Official Artifact

on:
  push:
    branches: [ "build/v1.6-official-candidate" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize verified V1.6 source delta
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          def materialize_b64(b64_text, output, expected_sha256):
              raw = base64.b64decode(b64_text, validate=True)
              data = gzip.decompress(raw)
              got = hashlib.sha256(data).hexdigest()
              if got != expected_sha256:
                  raise SystemExit(f"SOURCE HASH FAIL {output}: {got}")
              Path(output).parent.mkdir(parents=True, exist_ok=True)
              Path(output).write_bytes(data)
              print(f"SOURCE HASH OK {output}: {got}")

          chunks = []
          for i in range(8):
              p = Path(f"tools/v16_patch_chunks/{i:02d}.txt")
              if not p.is_file():
                  raise SystemExit(f"MISSING PATCH CHUNK {p}")
              chunks.append(p.read_text().strip())
          patch_b64 = "".join(chunks)
          if len(patch_b64) != 7428:
              raise SystemExit(f"PATCH B64 LENGTH FAIL: {len(patch_b64)}")
          materialize_b64(
              patch_b64,
              "tools/apply_v16.py",
              "56e759ba23c883314d28b9f11dc668f9d0a14409be8fae1fbb5672490a4ba4a4",
          )
          materialize_b64(
              Path("tools/V16Navigation.kt.gz.b64").read_text().strip(),
              "app/src/main/java/it/motolink/app/V16Navigation.kt",
              "4d075a026cf6d35bf567e4d8766954d4957712ae3331d3d42a3feb6eaaf974fd",
          )
          materialize_b64(
              Path("tools/V16ConnectionModeDialog.kt.gz.b64").read_text().strip(),
              "app/src/main/java/it/motolink/app/V16ConnectionModeDialog.kt",
              "7ff4f709a224a1d62a049aab521fd3bb613b1e496ae18890bf80393174303257",
          )
          PY
          python3 tools/apply_v16.py
          sed -i "/'connectionType = \\\"BLE_NAV\\\"',/d; /'connectionType = \\\"AUTOMATIC\\\"',/d" tools/apply_v16_profile_ui.py
          python3 tools/apply_v16_profile_ui.py
          python3 tools/apply_v16_garage_ui.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          if s.count("versionCode = 11") != 1:
              raise SystemExit("V1.6 BUILD CODE PATCH FAIL: expected versionCode 11 once")
          s = s.replace("versionCode = 11", "versionCode = 12", 1)
          p.write_text(s, encoding="utf-8")
          print("V1.6 BUILD CODE PATCH OK: versionCode 12, versionName unchanged")
          PY
          chmod +x ./gradlew
      - name: Inspect materialized BLE transport
        run: |
          set -euo pipefail
          NAV="app/src/main/java/it/motolink/app/V16Navigation.kt"
          echo '===== BLE transport anchors ====='
          grep -n -E 'writeCharacteristic|onCharacteristicWrite|READY service|Write GATT|scheduleReconnect|reconnect|heartbeat|WRITE_TYPE|PROPERTY_WRITE' "$NAV" || true
          echo '===== context around writeCharacteristic ====='
          LINE=$(grep -n 'writeCharacteristic' "$NAV" | head -1 | cut -d: -f1 || true)
          if [ -n "$LINE" ]; then
            START=$(( LINE > 80 ? LINE-80 : 1 ))
            END=$(( LINE+120 ))
            sed -n "${START},${END}p" "$NAV"
          fi
          echo '===== context around onCharacteristicWrite ====='
          LINE=$(grep -n 'onCharacteristicWrite' "$NAV" | head -1 | cut -d: -f1 || true)
          if [ -n "$LINE" ]; then
            START=$(( LINE > 80 ? LINE-80 : 1 ))
            END=$(( LINE+120 ))
            sed -n "${START},${END}p" "$NAV"
          fi
      - name: Verify V1.6 profile UI source
        run: |
          set -euo pipefail
          MAIN="app/src/main/java/it/motolink/app/MainActivity.kt"
          STORE="app/src/main/java/it/motolink/app/BikeProfileStore.kt"
          grep -F 'text = "Connessione:"' "$MAIN"
          grep -F 'listOf("Automatico", "Hotspot", "QrCode", "BLE")' "$MAIN"
          grep -F '"Automatico" -> "AUTOMATIC"' "$MAIN"
          grep -F '"Hotspot", "QrCode" -> "HOTSPOT_EASYCONN"' "$MAIN"
          grep -F '"BLE" -> "BLE_NAV"' "$MAIN"
          grep -F 'private fun showBikeProfileMenu(index: Int)' "$MAIN"
          grep -F 'private fun showBikeProfileCreationDialog(' "$MAIN"
          grep -F 'fun replaceAt(context: Context, index: Int, profile: BikeProfile): Boolean' "$STORE"
          grep -F 'message = "Il nome della moto è obbligatorio. Connessione e modello sono modificabili;' tools/apply_v16_garage_ui.py
          ! grep -F 'hint = "Descrizione (facoltativa)"' "$MAIN"
          ! grep -F 'V16ConnectionModeDialog.show' "$MAIN"
          ! grep -F 'private fun showV16ConnectionTypeChoice' "$MAIN"
          ! grep -F 'private fun showV16HotspotQrChoice' "$MAIN"
          test ! -f app/src/main/java/it/motolink/app/V16ConnectionModeDialog.kt
          grep -F 'versionCode = 12' app/build.gradle.kts
          grep -F 'versionName = "1.6"' app/build.gradle.kts
      - name: Compile release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify unsigned identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK")"
          echo "$BADGING" | head -n 4
          echo "$BADGING" | grep -F "package: name='it.motolink.app' versionCode='12' versionName='1.6'"
          sha256sum "$APK" > MotoLink_V1.6_UNSIGNED.sha256
      - name: Stage local-signing tools
        run: |
          mkdir -p out/signing-tools/lib
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/MotoLink_V1.6_UNSIGNED.apk
          cp MotoLink_V1.6_UNSIGNED.sha256 out/
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" out/signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/signing-tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.6_OFFICIAL_UNSIGNED_AND_SIGNING_TOOLS
          path: out/
          if-no-files-found: error
          retention-days: 2