name: Build MotoLink 1.7 final unsigned

on:
  push:
    branches:
      - "release/v1.7"
    paths:
      - ".github/workflows/build-v17-final-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MotoLink 1.7
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify V1.7 source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "it.motolink.app"' app/build.gradle.kts
          grep -F 'versionCode = 30' app/build.gradle.kts
          grep -F 'versionName = "1.7"' app/build.gradle.kts
          grep -F 'releaseNotes17()' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -F 'HOME · Navigation' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -F 'ГЛАВНАЯ · Навигация' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -F 'км' app/src/main/java/it/motolink/app/V16Navigation.kt

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          rm -rf app/build
          ./gradlew assembleRelease --stacktrace

      - name: Align final unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$SRC"
          "$BT/zipalign" -p -f 4 "$SRC" MotoLink_V1.7_FINAL_ALIGNED_UNSIGNED.apk
          "$BT/aapt2" dump badging MotoLink_V1.7_FINAL_ALIGNED_UNSIGNED.apk | tee badging.txt
          grep -F "package: name='it.motolink.app' versionCode='30' versionName='1.7'" badging.txt
          cp "$BT/lib/apksigner.jar" apksigner.jar
          sha256sum MotoLink_V1.7_FINAL_ALIGNED_UNSIGNED.apk apksigner.jar > SHA256SUMS_UNSIGNED.txt

      - name: Upload final unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.7_FINAL_UNSIGNED
          path: |
            MotoLink_V1.7_FINAL_ALIGNED_UNSIGNED.apk
            apksigner.jar
            badging.txt
            SHA256SUMS_UNSIGNED.txt
          if-no-files-found: error
          retention-days: 14
