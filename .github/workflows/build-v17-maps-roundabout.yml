name: Build MotoLink 1.7 Maps Roundabout Update

on:
  push:
    branches: [ "release/v1.7-maps-roundabout-hotfix" ]
    paths:
      - ".github/workflows/build-v17-maps-roundabout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify update scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "it.motolink.app"' app/build.gradle.kts
          grep -F 'versionCode = 31' app/build.gradle.kts
          grep -F 'versionName = "1.7"' app/build.gradle.kts
          grep -F '5fe695f1-fd7b-4f9b-98cc-ee6cf57a776e' app/src/main/java/it/motolink/app/V16Navigation.kt
          grep -F 'private const val HEARTBEAT_MS = 1000L' app/src/main/java/it/motolink/app/V16Navigation.kt
          grep -F 'Notification.EXTRA_TEXT_LINES' app/src/main/java/it/motolink/app/V16Navigation.kt
          grep -F 'notification.headsUpContentView' app/src/main/java/it/motolink/app/V16Navigation.kt
          grep -F 'roundaboutConfirmed' app/src/main/java/it/motolink/app/V16Navigation.kt
          grep -F 'Theme-independent preprocessing' app/src/main/java/it/motolink/app/V16ManeuverClassifier.kt
          grep -F 'RECOVERY RETE VC28' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -F 'projection == null || !projectionReadyForProximity' app/src/main/java/it/motolink/app/MirrorService.kt

          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD | sort)"
          echo "$CHANGED"
          for protected in             app/src/main/java/it/motolink/app/MirrorService.kt             app/src/main/java/it/motolink/app/BikeNetworkConnector.kt             app/src/main/java/it/motolink/app/EasyConnServers.kt             app/src/main/java/it/motolink/app/H264FrameBus.kt; do
            if echo "$CHANGED" | grep -Fx "$protected"; then
              echo "Protected component unexpectedly changed: $protected" >&2
              exit 1
            fi
          done

      - name: Static parser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/it/motolink/app/V16Navigation.kt").read_text(encoding="utf-8")
          c=Path("app/src/main/java/it/motolink/app/V16ManeuverClassifier.kt").read_text(encoding="utf-8")
          required=[
            "Notification.EXTRA_TEXT_LINES",
            "REMOTEVIEW_HEADSUP_DIRECT",
            "CONTENT_DESCRIPTION",
            '"км"',
            '"м"',
            '"公里"',
            '"米"',
            '"rotatoria"',
            '"roundabout"',
            '"круговое движение"',
            '"环岛"',
            "roundaboutEncoding?.annularDegrees",
            "roundaboutEncoding?.directionCode",
            'MAPS NAV V1.7 FIELD DIAG'
          ]
          missing=[x for x in required if x not in p]
          if missing: raise SystemExit(f"Missing parser invariants: {missing}")
          for x in ["CONFIRMED_MIN_SCORE","Theme-independent preprocessing","roundaboutConfirmed"]:
            if x not in c: raise SystemExit(f"Missing classifier invariant: {x}")
          print("STATIC_PARSER_REGRESSION_PASS")
          PY

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          rm -rf app/build
          ./gradlew assembleRelease --stacktrace

      - name: Align and verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$SRC"
          "$BT/zipalign" -p -f 4 "$SRC" MotoLink_V1.7_VC31_ALIGNED_UNSIGNED.apk
          "$BT/aapt2" dump badging MotoLink_V1.7_VC31_ALIGNED_UNSIGNED.apk | tee badging.txt
          grep -F "package: name='it.motolink.app' versionCode='31' versionName='1.7'" badging.txt
          cp "$BT/lib/apksigner.jar" apksigner.jar
          sha256sum MotoLink_V1.7_VC31_ALIGNED_UNSIGNED.apk apksigner.jar > SHA256SUMS_UNSIGNED.txt

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.7_VC31_MAPS_ROUNDABOUT_UNSIGNED
          path: |
            MotoLink_V1.7_VC31_ALIGNED_UNSIGNED.apk
            apksigner.jar
            badging.txt
            SHA256SUMS_UNSIGNED.txt
          if-no-files-found: error
          retention-days: 14
