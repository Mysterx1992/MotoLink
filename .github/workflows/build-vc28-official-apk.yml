name: Build official MotoLink vc28 APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-vc28-official-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and sign vc28
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Restore official MotoLink keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.MOTOLINK_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/motolink-release.jks"

      - name: Zipalign and sign official APK
        env:
          MOTOLINK_KEYSTORE_PASSWORD: ${{ secrets.MOTOLINK_KEYSTORE_PASSWORD }}
          MOTOLINK_KEY_ALIAS: ${{ secrets.MOTOLINK_KEY_ALIAS }}
          MOTOLINK_KEY_PASSWORD: ${{ secrets.MOTOLINK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED="app/build/outputs/apk/release/app-release.apk"
          fi
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/MotoLink_vc28_aligned.apk"
          "$BT/apksigner" sign             --ks "$RUNNER_TEMP/motolink-release.jks"             --ks-key-alias "$MOTOLINK_KEY_ALIAS"             --ks-pass env:MOTOLINK_KEYSTORE_PASSWORD             --key-pass env:MOTOLINK_KEY_PASSWORD             --v2-signing-enabled true             --v3-signing-enabled true             --out "MotoLink_V1.6_VC28_FULL_TFT_RECOVERY_OFFICIAL_SIGNED.apk"             "$RUNNER_TEMP/MotoLink_vc28_aligned.apk"

      - name: Verify package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="MotoLink_V1.6_VC28_FULL_TFT_RECOVERY_OFFICIAL_SIGNED.apk"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verify.txt
          grep -qi "Verified using v2 scheme.*true" verify.txt
          grep -qi "Verified using v3 scheme.*true" verify.txt
          grep -qi "9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100" verify.txt
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='it.motolink.app'" badging.txt
          grep -q "versionCode='28'" badging.txt
          grep -q "versionName='1.6'" badging.txt
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Upload official vc28 APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.6_VC28_FULL_TFT_RECOVERY_OFFICIAL_SIGNED
          path: |
            MotoLink_V1.6_VC28_FULL_TFT_RECOVERY_OFFICIAL_SIGNED.apk
            SHA256SUMS.txt
            verify.txt
            badging.txt
          if-no-files-found: error
          retention-days: 30
