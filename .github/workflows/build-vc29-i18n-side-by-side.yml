name: Build MotoLink vc29 i18n side-by-side test
# Final rebuild includes full IT/EN/RU/ZH guide localization and distinct TEST listener label.

on:
  push:
    branches: [ "test/v1.6-vc29-i18n-side-by-side" ]
    paths:
      - ".github/workflows/build-vc29-i18n-side-by-side.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed debug test APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE.apk

      - name: Verify test identity
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          APK="MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE.apk"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | tee badging.txt
          grep -q "package: name='it.motolink.app.test'" badging.txt
          grep -q "versionCode='29'" badging.txt
          grep -q "versionName='1.6-test-vc29-i18n'" badging.txt
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Upload tester APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE
          path: |
            MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE.apk
            SHA256SUMS.txt
            badging.txt
          if-no-files-found: error
          retention-days: 14
