name: Build MotoLink vc29 RU test artifact

on:
  push:
    branches: [ "test/v1.6-vc29-russian-maps-parser" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build vc29 RU test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Zipalign and package signer
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$SRC" ]; then SRC="app/build/outputs/apk/release/app-release.apk"; fi
          "$BT/zipalign" -f -p 4 "$SRC" MotoLink_V1.6_TEST_VC29_RU_ALIGNED_UNSIGNED.apk
          cp "$BT/lib/apksigner.jar" apksigner.jar
          sha256sum MotoLink_V1.6_TEST_VC29_RU_ALIGNED_UNSIGNED.apk apksigner.jar > SHA256SUMS.txt

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.6_TEST_VC29_RU_UNSIGNED
          path: |
            MotoLink_V1.6_TEST_VC29_RU_ALIGNED_UNSIGNED.apk
            apksigner.jar
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
