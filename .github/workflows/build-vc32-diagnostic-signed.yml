name: Build signed MotoLink V1.7 vc32 diagnostic APK

on:
  push:
    branches:
      - diagnostics/v17-maps-field-probe-vc32
    paths:
      - .github/workflows/build-vc32-diagnostic-signed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify private diagnostic APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned production-mode APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Restore existing official signing identity
        env:
          MOTOLINK_KEYSTORE_B64: ${{ secrets.MOTOLINK_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MOTOLINK_KEYSTORE_B64" ]; then
            echo "Signing keystore is not configured; refusing to emit an unsigned install candidate."
            exit 1
          fi
          printf '%s' "$MOTOLINK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/motolink-diagnostic-release.jks"
          chmod 600 "$RUNNER_TEMP/motolink-diagnostic-release.jks"

      - name: Zipalign and sign vc32
        env:
          MOTOLINK_KEYSTORE_PASSWORD: ${{ secrets.MOTOLINK_KEYSTORE_PASSWORD }}
          MOTOLINK_KEY_ALIAS: ${{ secrets.MOTOLINK_KEY_ALIAS }}
          MOTOLINK_KEY_PASSWORD: ${{ secrets.MOTOLINK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED=app/build/outputs/apk/release/app-release.apk
          fi
          test -s "$UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/vc32-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/motolink-diagnostic-release.jks" \
            --ks-key-alias "$MOTOLINK_KEY_ALIAS" \
            --ks-pass env:MOTOLINK_KEYSTORE_PASSWORD \
            --key-pass env:MOTOLINK_KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out MotoLink_V1.7_VC32_MAPS_FIELD_DIAG_OFFICIAL_SIGNED.apk \
            "$RUNNER_TEMP/vc32-aligned.apk"
          rm -f "$RUNNER_TEMP/motolink-diagnostic-release.jks"

      - name: Verify exact signature, version and packaging
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=MotoLink_V1.7_VC32_MAPS_FIELD_DIAG_OFFICIAL_SIGNED.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verify.txt
          grep -qi 'Verified using v2 scheme.*true' verify.txt
          grep -qi 'Verified using v3 scheme.*true' verify.txt
          grep -qi '9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100' verify.txt
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='it.motolink.app'" badging.txt
          grep -q "versionCode='32'" badging.txt
          grep -q "versionName='1.7'" badging.txt
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Upload signed diagnostic APK as CI artifact only
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.7_VC32_MAPS_FIELD_DIAG_OFFICIAL_SIGNED
          path: |
            MotoLink_V1.7_VC32_MAPS_FIELD_DIAG_OFFICIAL_SIGNED.apk
            SHA256SUMS.txt
            verify.txt
            badging.txt
          if-no-files-found: error
          retention-days: 30
