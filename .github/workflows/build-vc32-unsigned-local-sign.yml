name: Prepare unsigned MotoLink V1.7 vc32 for secure local signing

on:
  push:
    branches:
      - diagnostics/v17-maps-field-probe-vc32
    paths:
      - .github/workflows/build-vc32-unsigned-local-sign.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release artifact without credentials
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          cp "$UNSIGNED" MotoLink_V1.7_VC32_DIAG_UNSIGNED.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging MotoLink_V1.7_VC32_DIAG_UNSIGNED.apk | grep -E "^package:|^sdkVersion:|^targetSdkVersion:" > APK_INFO.txt
          grep -q "package: name='it.motolink.app'" APK_INFO.txt
          grep -q "versionCode='32'" APK_INFO.txt
          grep -q "versionName='1.7'" APK_INFO.txt
          sha256sum MotoLink_V1.7_VC32_DIAG_UNSIGNED.apk > SHA256SUMS.txt
      - name: Upload unsigned APK for local signing only
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.7_VC32_DIAG_UNSIGNED
          path: |
            MotoLink_V1.7_VC32_DIAG_UNSIGNED.apk
            APK_INFO.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
