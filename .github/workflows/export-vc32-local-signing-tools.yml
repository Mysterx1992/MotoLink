name: Export Android build tools for private vc32 signing

on:
  push:
    branches:
      - diagnostics/v17-maps-field-probe-vc32
    paths:
      - .github/workflows/export-vc32-local-signing-tools.yml

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Install official Android API 36 signing tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/zipalign
          chmod +x signing-tools/zipalign
          ls -lh signing-tools
          sha256sum signing-tools/* > tool_hashes.txt
      - name: Upload binaries (no credentials)
        uses: actions/upload-artifact@v4
        with:
          name: Official_Android_36_Local_Signing_Tools
          path: |
            signing-tools/
            tool_hashes.txt
          if-no-files-found: error
          retention-days: 1
