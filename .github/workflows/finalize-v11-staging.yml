name: Finalize MotoLink V1.1 staging

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  finalize-v11:
    if: github.event.head_commit.message == 'Run one-shot MotoLink V1.1 staging finalizer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1.1 staging branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.1
          fetch-depth: 0

      - name: Reconstruct exact staged V1.1 payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/motolink_v11.b64
          for n in 00 01 02 03 04 05 06 07 08; do
            head -c 12000 ".v11sync/chunk_${n}" >> /tmp/motolink_v11.b64
          done
          head -c 10772 .v11sync/chunk_09 >> /tmp/motolink_v11.b64
          test "$(wc -c < /tmp/motolink_v11.b64)" -eq 118772
          test "$(sha256sum /tmp/motolink_v11.b64 | awk '{print $1}')" = "e30aa8b2886672a8644b1d0a243b9b29c955776fd9e005cef442a2ee94ac4b9f"
          base64 --decode /tmp/motolink_v11.b64 > /tmp/motolink_v11.tar.gz
          test "$(sha256sum /tmp/motolink_v11.tar.gz | awk '{print $1}')" = "a0dea59fc9cf808b9ed1b9efcb7296604579f4eb4351b721bf9f6c4ea6719abc"
          gzip -t /tmp/motolink_v11.tar.gz
          tar -tzf /tmp/motolink_v11.tar.gz
          tar -xzf /tmp/motolink_v11.tar.gz
          rm -rf .v11sync
          rm -f .github/workflows/finalize-v11.yml

      - name: Verify V1.1 identity and frozen geometry
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "it.motolink.app"' app/build.gradle.kts
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "1.1"' app/build.gradle.kts
          grep -q 'REFERENCE_TARGET_WIDTH = 800' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_TARGET_HEIGHT = 480' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_VIEWPORT_X = -35' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_VIEWPORT_Y = 46' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_VIEWPORT_WIDTH = 830' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_VIEWPORT_HEIGHT = 428' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          test -f docs/RELEASE_NOTES_V1.1.md

      - name: Commit clean V1.1 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mysterx1992"
          git config user.email "scarano.emanuele@hotmail.com"
          git add -A
          git commit -m "Prepare MotoLink V1.1 release"
          git push origin HEAD:release/v1.1
