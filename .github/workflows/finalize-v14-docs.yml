name: Finalize MotoLink V1.4 docs

on:
  push:
    branches: [ "release/v1.4" ]

permissions:
  contents: write

jobs:
  finalize-v14-docs:
    if: github.event.head_commit.message == 'Run MotoLink V1.4 docs finalizer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1.4 release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.4
          fetch-depth: 0

      - name: Update V1.4 public documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          release_notes = '''# MotoLink V1.4

Aggiornamento di compatibilità, stabilità e gestione del mirroring.

## Novità e correzioni

- Aggiunto un percorso dedicato per i profili CFMOTO: il nome WLAN Direct ricavato dal QR viene normalizzato sul peer reale della moto e viene mantenuto un fallback sulla rete indicata dal QR.
- Corretto il collegamento HOTSPOT su Trofeo/Valico quando Android mantiene la rete mobile come rete predefinita: MotoLink può usare la rete Wi-Fi locale della moto senza cambiare la connettività delle altre app.
- Migliorata la gestione CFMOTO del display e della rotazione durante il mirroring.
- Migliorata la riconnessione del flusso video quando si esce e si rientra nella modalità mirroring del TFT.
- Migliorato il riaggancio dell'interfaccia MotoLink a una sessione di mirroring già attiva, evitando START duplicati dopo la ricreazione dell'Activity.
- Corretto Adattamento: dopo la regolazione, la X chiude l'editor e porta l'interruttore su OFF, ma la personalizzazione salvata continua a essere applicata nelle sessioni successive.
- Le regolazioni Adattamento restano separate per profilo moto e orientamento e vengono azzerate solo con un ripristino esplicito dell'utente.
- EasyConn wire-level, H264FrameBus e la geometria V15 di riferimento restano invariati.

## Aggiornamento dalla V1.2

Chi utilizza la release ufficiale MotoLink V1.2 può installare `MotoLink_V1.4.apk` direttamente sopra la V1.2. Profili e impostazioni locali vengono mantenuti dal normale aggiornamento Android.

La V1.3 non viene pubblicata come release GitHub: il canale pubblico passa direttamente da V1.2 a V1.4.

## Licenza

Il codice sorgente è pubblico e consultabile, ma MotoLink **non è open source**. Tutti i diritti sono riservati; vedere `LICENSE`.
'''
          Path('docs/RELEASE_NOTES_V1.4.md').write_text(release_notes, encoding='utf-8')

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = '''## v1.4 — 2026-09-07

### Novità e correzioni

- Percorso di connessione dedicato ai profili CFMOTO con normalizzazione del peer WLAN Direct e fallback rete QR.
- Correzione HOTSPOT per reti moto locali quando Android mantiene la rete mobile come predefinita.
- Miglioramenti CFMOTO a rotazione/display e recovery del video.
- Riaggancio dell'interfaccia a sessioni di mirroring già attive.
- Adattamento persistente: chiusura editor con X e personalizzazione mantenuta fino a ripristino esplicito.
- Core EasyConn/H264 e geometria V15 di riferimento mantenuti invariati.

'''
          if '## v1.4 — 2026-09-07' not in changelog:
              changelog = changelog.replace('# Changelog MotoLink\n\n', '# Changelog MotoLink\n\n' + section, 1)
          Path('CHANGELOG.md').write_text(changelog, encoding='utf-8')

          readme = Path('README.md').read_text(encoding='utf-8')
          readme = readme.replace('releases/download/v1.1/MotoLink_V1.1.apk', 'releases/download/v1.4/MotoLink_V1.4.apk')
          readme = readme.replace('MotoLink%20V1.1', 'MotoLink%20V1.4')
          readme = readme.replace('Scarica MotoLink V1.1', 'Scarica MotoLink V1.4')
          readme = readme.replace('## 🆕 MotoLink V1.1', '## 🆕 MotoLink V1.4')
          start = readme.find('La V1.1 è un aggiornamento consigliato')
          end = readme.find('\n---\n\n## Download MotoLink', start)
          if start != -1 and end != -1:
              replacement = '''La V1.4 è l'aggiornamento pubblico successivo alla V1.2 e introduce correzioni di compatibilità, recovery e persistenza delle regolazioni.

### Novità principali

- **CFMOTO**: percorso WLAN Direct dedicato con riconoscimento del peer reale della moto e fallback sulla rete QR.
- **HOTSPOT Trofeo/Valico**: MotoLink rileva la rete Wi-Fi locale della moto anche quando Android mantiene il 4G/5G come rete predefinita.
- **Display e rotazione CFMOTO**: gestione migliorata durante il mirroring.
- **Recovery video**: migliorata la ripresa del flusso quando si esce e si rientra nella modalità mirroring del TFT.
- **Sessione già attiva**: l'interfaccia si riaggancia al mirroring esistente evitando avvii duplicati.
- **Adattamento persistente**: la X chiude l'editor e porta l'interruttore su OFF, mentre la personalizzazione resta applicata finché l'utente non sceglie un ripristino esplicito.

### Aggiornamento dalla V1.2

La release ufficiale MotoLink V1.2 può essere aggiornata direttamente installando `MotoLink_V1.4.apk`. La firma permanente MotoLink resta la stessa e il normale aggiornamento Android mantiene profili e impostazioni locali.

La V1.3 non è pubblicata: il canale GitHub passa direttamente da **V1.2 a V1.4**.
'''
              readme = readme[:start] + replacement + readme[end:]
          readme = readme.replace('### APK ufficiale V1.1', '### APK ufficiale V1.4')
          readme = readme.replace('MotoLink_V1.1.apk', 'MotoLink_V1.4.apk')
          readme = readme.replace('Download diretto MotoLink V1.1', 'Download diretto MotoLink V1.4')
          readme = readme.replace('| _CfMoto_ | _None_ | _None_ | _None_ | No Testata | _App ancora da testare su CfMoto_ |', '| _CFMOTO_ | _Da confermare_ | _Da confermare_ | _TFT / EasyConn_ | ✅ Testata | _Connessione e mirroring verificati; compatibilità in ampliamento_ |')
          old_privacy = "L'app non richiede accesso diretto a fotocamera, microfono, contatti, SMS o file personali. La scansione QR utilizza l'interfaccia fornita dai servizi Google."
          new_privacy = "MotoLink non richiede accesso a microfono, contatti o SMS. Per il QR usa come prima scelta Google Code Scanner; se non è disponibile sul telefono può usare lo scanner interno CameraX + ML Kit, richiedendo il permesso Fotocamera solo quando necessario."
          readme = readme.replace(old_privacy, new_privacy)
          readme = readme.replace('| Release pubblica | ✅ `v1.1` |', '| Release pubblica | ✅ `v1.4` |')
          readme = readme.replace('<strong>MotoLink V1.1</strong>', '<strong>MotoLink V1.4</strong>')
          Path('README.md').write_text(readme, encoding='utf-8')
          PY

          BLOCKED_RE='moto[- _]?'$(printf 'hub')
          if grep -RniE "$BLOCKED_RE" README.md CHANGELOG.md docs/RELEASE_NOTES_V1.4.md; then
            echo 'Forbidden external-product reference found'
            exit 1
          fi

      - name: Commit clean V1.4 docs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-v14-docs.yml
          git config user.name "Mysterx1992"
          git config user.email "scarano.emanuele@hotmail.com"
          git add -A
          git commit -m "Add MotoLink V1.4 release notes"
          git push origin HEAD:release/v1.4
