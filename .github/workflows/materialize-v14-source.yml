name: Materialize MotoLink V1.4 source

on:
  push:
    branches: [ "release/v1.4" ]

permissions:
  contents: write

jobs:
  materialize-v14:
    if: github.event.head_commit.message == 'Run MotoLink V1.4 source materializer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1.4 release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.4
          fetch-depth: 0

      - name: Fetch public main baseline
        run: git fetch origin main

      - name: Materialize V1.4 source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v14_r7.py
          python3 .github/scripts/patch_v14_r8_adaptation.py

      - name: Verify V1.4 identity and frozen core
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "it.motolink.app"' app/build.gradle.kts
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "1.4"' app/build.gradle.kts
          grep -q 'REFERENCE_TARGET_WIDTH = 800' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_TARGET_HEIGHT = 480' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_VIEWPORT_X = -35' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_VIEWPORT_Y = 46' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_VIEWPORT_WIDTH = 830' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          grep -q 'REFERENCE_VIEWPORT_HEIGHT = 428' app/src/main/java/it/motolink/app/MirrorAdaptationConfig.kt
          git diff --exit-code origin/main -- \
            app/src/main/java/it/motolink/app/EasyConnDiscovery.kt \
            app/src/main/java/it/motolink/app/EasyConnInitClient.kt \
            app/src/main/java/it/motolink/app/EasyConnServers.kt \
            app/src/main/java/it/motolink/app/H264FrameBus.kt
          BLOCKED_RE='moto[- _]?'$(printf 'hub')
          if grep -RniE "$BLOCKED_RE" app docs README.md .github --include='*.kt' --include='*.kts' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.py' --include='*.txt'; then
            echo 'Forbidden external-product reference found'
            exit 1
          fi

      - name: Remove temporary build scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/android-ci.yml
          rm -f .github/scripts/patch_v14_r7.py
          rm -f .github/scripts/patch_v14_r8_adaptation.py
          rmdir .github/scripts 2>/dev/null || true
          rm -f .github/workflows/materialize-v14-source.yml

      - name: Commit clean V1.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mysterx1992"
          git config user.email "scarano.emanuele@hotmail.com"
          git add -A
          git commit -m "Prepare MotoLink V1.4 release source"
          git push origin HEAD:release/v1.4
