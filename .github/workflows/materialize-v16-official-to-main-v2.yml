name: Publish MotoLink V1.6 exact source to main

on:
  push:
    branches: [ "build/v1.6-vc21-route-remaining-distance" ]
    paths: [ ".github/workflows/materialize-v16-official-to-main-v2.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      EXPECTED_MODEL_BLOB: e0104c6dcd104f05ee3fe08eb9922c036d60c9da
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize exact vc21 lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/build-v16-vc21-route-remaining-distance.yml').read_text(encoding='utf-8')
          names = ['Materialize exact vc20 source lineage', 'Apply vc21 route remaining distance fix']
          out=[]
          for name in names:
              marker=f'      - name: {name}\n        run: |\n'
              if wf.count(marker)!=1:
                  raise SystemExit(f'materializer marker mismatch: {name}')
              start=wf.index(marker)+len(marker)
              end=wf.find('\n      - name:',start)
              if end<0: raise SystemExit(f'next step not found: {name}')
              for line in wf[start:end].splitlines():
                  if line.startswith('          '): out.append(line[10:])
                  elif not line.strip(): out.append('')
                  else: raise SystemExit(f'unexpected indentation: {line!r}')
              out.append('')
          Path('/tmp/materialize_vc21.sh').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          bash /tmp/materialize_vc21.sh

      - name: Verify frozen V1.6 markers and save tree
        shell: bash
        run: |
          set -euo pipefail
          NAV=app/src/main/java/it/motolink/app/V16Navigation.kt
          ML=app/src/main/java/it/motolink/app/V16ManeuverClassifier.kt
          grep -F 'versionCode = 21' app/build.gradle.kts
          grep -F 'versionName = "1.6"' app/build.gradle.kts
          grep -F 'ZERO TRANSITION GUARD: distance=0 soppressa' "$NAV"
          grep -F 'routeRemain=${model.routeRemainDistanceMeters ?: -1}m' "$NAV"
          grep -F 'heartbeat DEFAULT rifiutato status=3; ritento una volta con WRITE_TYPE_NO_RESPONSE' "$NAV"
          grep -F 'p[14] = m.roadFlag.coerceIn(0, 4).toByte()' "$NAV"
          grep -F 'p[16] = m.annularDegrees.coerceIn(0, 255).toByte()' "$NAV"
          grep -F 'p[10] = (m.directionOverride ?: directionCode(m.maneuver)).coerceIn(0, 9).toByte()' "$NAV"
          grep -F 'data class RoundaboutEncoding' "$ML"
          test "$(git hash-object app/src/main/res/raw/maneuver_model.tflite)" = "$EXPECTED_MODEL_BLOB"
          tar -C . -czf /tmp/motolink-v16-app.tgz app/src app/build.gradle.kts
          cp THIRD_PARTY_NOTICES.md /tmp/THIRD_PARTY_NOTICES.md

      - name: Overlay exact V1.6 source on current main
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout -B publish-v1.6-main origin/main
          rm -rf app/src
          tar -C . -xzf /tmp/motolink-v16-app.tgz
          cp /tmp/THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md
          mkdir -p docs
          cat > docs/RELEASE_NOTES_V1.6.md <<'EOF'
          # MotoLink V1.6

          MotoLink V1.6 introduce la modalità **BLE turn-by-turn** per TFT VOGE compatibili, mantenendo il mirroring EasyConn tramite i profili Hotspot/QR.

          ## Novità principali
          - profilo **BLE** dedicato alla navigazione turn-by-turn, separato dal mirroring video;
          - trasporto BLE VOGE con heartbeat, coda serializzata e fallback adattivo `WRITE_TYPE_NO_RESPONSE`;
          - interpretazione locale delle indicazioni Google Maps, comprese le uscite di rotonda, tramite modello TensorFlow Lite sul dispositivo;
          - encoding VOGE aggiornato per direzione, `roadFlag`, settore anulare e campi di percorso;
          - **Zero Transition Guard** per evitare che una transizione a 0 m sovrascriva la manovra successiva;
          - compilazione dei campi VOGE di **tempo e chilometraggio restanti** quando Google Maps li espone nella notifica;
          - recovery BLE migliorato, mantenendo il core EasyConn/H264 già validato;
          - Garage e scelta profilo aggiornati per Hotspot, QR Code e BLE.

          ## Compatibilità e limiti
          La modalità BLE invia indicazioni di navigazione e **non effettua mirroring video**. La resa grafica delle manovre dipende dal firmware TFT: alcuni display possono mostrare la freccia dell'uscita invece di un'icona circolare dedicata per le rotonde.

          I campi di tempo e chilometraggio restanti sono implementati in V1.6; la loro resa finale dipende anche dai dati esposti dalla versione di Google Maps e dal firmware TFT.

          ## APK ufficiale
          Scaricare `MotoLink_V1.6.apk` dagli asset della release GitHub V1.6. L'APK mantiene la firma permanente MotoLink.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8') if p.exists() else '# Changelog\n'
          if '## V1.6\n' not in s:
              block='''\n## V1.6\n\n- Modalità BLE turn-by-turn per TFT VOGE compatibili.\n- Fallback adattivo WRITE_TYPE_NO_RESPONSE.\n- Classificazione locale delle uscite di rotonda.\n- Encoding VOGE direction/roadFlag/annularDegrees aggiornato.\n- Zero Transition Guard per gli aggiornamenti transitori a 0 m.\n- Tempo e distanza restanti del percorso valorizzati quando disponibili da Google Maps.\n- Core mirroring EasyConn/H264 preservato.\n\n'''
              first=s.find('\n') if s.startswith('#') else -1
              s=(s[:first+1]+block+s[first+1:]) if first>=0 else (block+s)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Compile public main overlay and verify identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build
          ./gradlew assembleRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='it.motolink.app' versionCode='21' versionName='1.6'"
          echo "Public overlay unsigned SHA-256: $(sha256sum "$APK" | awk '{print $1}')"

      - name: Commit and push V1.6 source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MotoLink Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src app/build.gradle.kts THIRD_PARTY_NOTICES.md CHANGELOG.md docs/RELEASE_NOTES_V1.6.md
          git commit -m 'Publish MotoLink V1.6 official source'
          git push origin HEAD:main
          echo "Published main SHA: $(git rev-parse HEAD)"
