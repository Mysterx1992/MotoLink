name: MotoLink V1.8.2 Play TEST multilingual BLE build
on:
  push:
    branches:
      - play/v182-localized-ble-resync-test
    paths:
      - ".github/workflows/play-v182-localized-test.yml"
      - "app/**"
      - "scripts/check_locale_v182.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate isolated Play TEST build and inherited BLE/four languages
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".preplaytest2"' app/build.gradle.kts
          grep -Fq 'versionCode = 36' app/build.gradle.kts
          grep -Fq 'versionName = "1.8.2"' app/build.gradle.kts
          python3 scripts/check_locale_v182.py
          python3 scripts/check_ble_navigation_resync.py
          python3 tools/v18_ble_regression.py
          python3 scripts/check_privacy_deletion_contract.py
      - name: Build standalone Play TEST debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Verify package, version, certificate and 16KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > PLAY_TEST_SIGNATURE.txt
          "$BT/aapt" dump badging "$APK" > PLAY_TEST_BADGING.txt
          grep -Fq "package: name='it.motolink.app.preplaytest2'" PLAY_TEST_BADGING.txt
          grep -Fq "versionCode='36'" PLAY_TEST_BADGING.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK" > PLAY_TEST_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1_8_2_PLAY_TEST_BLE_MULTILANG_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            PLAY_TEST_SHA256.txt
            PLAY_TEST_BADGING.txt
            PLAY_TEST_SIGNATURE.txt
          if-no-files-found: error
          retention-days: 30
