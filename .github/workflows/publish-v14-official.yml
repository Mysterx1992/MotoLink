name: Publish MotoLink V1.4 Official

on:
  push:
    branches: [ "automation/publish-v1.4" ]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Verify and publish V1.4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4

      - name: Download exact V1.4 unsigned APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10006126589/zip > unsigned.zip
          unzip -q unsigned.zip
          echo "e9471bc360cb634f287f3ada5046d976f523b6e59ace9993ad57881483e3e63e  MotoLink_V1.4_UNSIGNED_R8.apk" | sha256sum -c -

      - name: Reconstruct permanent-signed V1.4
        run: |
          set -euo pipefail
          : > signed-tail.b64
          for n in 00 01 02 03 04 05 06; do
            cat ".release/v1.4/tail_chunk_${n}" >> signed-tail.b64
          done
          test "$(wc -c < signed-tail.b64)" -eq 73740
          echo "2eb8591410bd5448c55173bbf4435cae6c5fbd631933ddcbe312c508e5242ee8  signed-tail.b64" | sha256sum -c -
          base64 -d signed-tail.b64 > signed-tail.xz
          xz -dc signed-tail.xz > signed-tail.bin
          test "$(stat -c%s signed-tail.bin)" -eq 86363
          echo "05f6c8b5f0a6521411f0ea7c12fc747d4db39aaa79fdb1009d03ce42fb58c35b  signed-tail.bin" | sha256sum -c -
          head -c 53589038 MotoLink_V1.4_UNSIGNED_R8.apk > MotoLink_V1.4.apk
          cat signed-tail.bin >> MotoLink_V1.4.apk
          test "$(stat -c%s MotoLink_V1.4.apk)" -eq 53675401
          echo "d27e795afd3a8a2c65011e706d7c6f17c49f6a64f9274cb9a232a958e9113361  MotoLink_V1.4.apk" | sha256sum -c -

      - name: Verify permanent MotoLink signature
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar --apks MotoLink_V1.4.apk --onlyVerify --skipZipAlign --verifySha256 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4 >/dev/null 2>&1; then
            gh release upload v1.4 MotoLink_V1.4.apk --clobber
          else
            gh release create v1.4 MotoLink_V1.4.apk \
              --target 52264e7501f00b191bf4e5d93c6fd1f3c37ae2f4 \
              --title "MotoLink V1.4" \
              --notes-file docs/RELEASE_NOTES_V1.4.md
          fi
