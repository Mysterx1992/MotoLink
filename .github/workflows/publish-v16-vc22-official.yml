name: Publish MotoLink V1.6 vc22 official

on:
  push:
    branches:
      - "release/v1.6-vc22"
    paths:
      - ".github/workflows/publish-v16-vc22-official.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout frozen release source
        uses: actions/checkout@v4
        with:
          ref: release/v1.6-vc22
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate one-time signing handoff certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/signing-handoff
          openssl req -x509 -newkey rsa:4096 -nodes             -keyout "$RUNNER_TEMP/motolink-v16-handoff-private.pem"             -out .github/signing-handoff/v16-vc22-public-cert.pem             -subj "/CN=MotoLink-v1.6-vc22-one-time-handoff"             -days 1
          chmod 600 "$RUNNER_TEMP/motolink-v16-handoff-private.pem"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/signing-handoff/v16-vc22-public-cert.pem
          git commit -m "Publish one-time V1.6 vc22 signing handoff certificate"
          git push origin HEAD:release/v1.6-vc22

      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=".github/signing-handoff/v16-vc22-signing.cms.b64"
          for i in $(seq 1 60); do
            git fetch origin release/v1.6-vc22
            if git cat-file -e "origin/release/v1.6-vc22:$PAYLOAD" 2>/dev/null; then
              git show "origin/release/v1.6-vc22:$PAYLOAD" > "$RUNNER_TEMP/signing.cms.b64"
              echo "Encrypted signing payload received."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for encrypted signing payload." >&2
          exit 1

      - name: Decrypt signing backup locally on runner
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/signing.cms.b64" > "$RUNNER_TEMP/signing.cms"
          openssl cms -decrypt -inform DER             -in "$RUNNER_TEMP/signing.cms"             -recip .github/signing-handoff/v16-vc22-public-cert.pem             -inkey "$RUNNER_TEMP/motolink-v16-handoff-private.pem"             -out "$RUNNER_TEMP/signing-backup.zip"
          mkdir -p "$RUNNER_TEMP/signing"
          unzip -q "$RUNNER_TEMP/signing-backup.zip" -d "$RUNNER_TEMP/signing"
          test -s "$RUNNER_TEMP/signing/MotoLink_Release_Keystore.jks"
          test -s "$RUNNER_TEMP/signing/GITHUB_SECRETS.txt"

      - name: Load signing credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__('os').environ['RUNNER_TEMP']) / 'signing' / 'GITHUB_SECRETS.txt'
          values = {}
          for raw in p.read_text(encoding='utf-8').splitlines():
              if '=' not in raw or raw.lstrip().startswith('#'):
                  continue
              k, v = raw.split('=', 1)
              k = k.strip()
              if k in {'MOTOLINK_KEYSTORE_PASSWORD','MOTOLINK_KEY_ALIAS','MOTOLINK_KEY_PASSWORD'}:
                  values[k] = v.strip()
          missing = {'MOTOLINK_KEYSTORE_PASSWORD','MOTOLINK_KEY_ALIAS','MOTOLINK_KEY_PASSWORD'} - values.keys()
          if missing:
              raise SystemExit('Missing required signing fields')
          env = Path(__import__('os').environ['GITHUB_ENV'])
          with env.open('a', encoding='utf-8') as f:
              for k, v in values.items():
                  print(f'::add-mask::{v}')
                  f.write(f'{k}={v}\n')
          PY

      - name: Build exact V1.6 vc22 unsigned release
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 22' app/build.gradle.kts
          grep -F 'versionName = "1.6"' app/build.gradle.kts
          grep -F 'if (projection == null || !proximityGateAllowed)' app/src/main/java/it/motolink/app/MirrorService.kt
          rm -rf app/build
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify official MotoLink identity
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/MotoLink_V1.6_vc22_aligned.apk"
          APK="MotoLink_V1.6_VC22_PROXIMITY_HOTFIX_OFFICIAL_SIGNED.apk"
          KS="$RUNNER_TEMP/signing/MotoLink_Release_Keystore.jks"

          "$BT/aapt2" dump badging "$UNSIGNED" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='it.motolink.app' versionCode='22' versionName='1.6'" "$RUNNER_TEMP/badging.txt"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          export MOTOLINK_KS_PASS="$MOTOLINK_KEYSTORE_PASSWORD"
          export MOTOLINK_KEY_PASS="$MOTOLINK_KEY_PASSWORD"
          "$BT/apksigner" sign             --ks "$KS"             --ks-key-alias "$MOTOLINK_KEY_ALIAS"             --ks-pass env:MOTOLINK_KS_PASS             --key-pass env:MOTOLINK_KEY_PASS             --v1-signing-enabled false             --v2-signing-enabled true             --v3-signing-enabled true             --out "$APK"             "$ALIGNED"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Fi "Signer #1 certificate SHA-256 digest: 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100" "$RUNNER_TEMP/apksigner.txt"
          "$BT/aapt2" dump badging "$APK" | grep -F "package: name='it.motolink.app' versionCode='22' versionName='1.6'"
          sha256sum "$APK" | tee SHA256SUMS_V1.6_VC22.txt

      - name: Publish stable V1.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="MotoLink_V1.6_VC22_PROXIMITY_HOTFIX_OFFICIAL_SIGNED.apk"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          cp docs/RELEASE_V1.6_VC22.md "$RUNNER_TEMP/release-notes.md"
          python3 - "$SHA" <<'PY'
          import re, sys
          from pathlib import Path
          sha = sys.argv[1]
          p = Path(__import__('os').environ['RUNNER_TEMP']) / 'release-notes.md'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(?m)^- SHA-256 APK: `[0-9a-f]{64}`$', f'- SHA-256 APK: `{sha}`', s)
          p.write_text(s, encoding='utf-8')
          PY

          gh release upload v1.6 "$APK" SHA256SUMS_V1.6_VC22.txt --clobber
          gh release edit v1.6             --draft=false             --prerelease=false             --title "MotoLink V1.6 vc22"             --notes-file "$RUNNER_TEMP/release-notes.md"             --target release/v1.6-vc22

      - name: Cleanup sensitive temporary material
        if: always()
        shell: bash
        run: |
          set +e
          for f in             "$RUNNER_TEMP/motolink-v16-handoff-private.pem"             "$RUNNER_TEMP/signing.cms.b64"             "$RUNNER_TEMP/signing.cms"             "$RUNNER_TEMP/signing-backup.zip"             "$RUNNER_TEMP/signing/MotoLink_Release_Keystore.jks"             "$RUNNER_TEMP/signing/GITHUB_SECRETS.txt"; do
            if [ -f "$f" ]; then shred -u "$f" 2>/dev/null || rm -f "$f"; fi
          done
          rm -rf "$RUNNER_TEMP/signing"
