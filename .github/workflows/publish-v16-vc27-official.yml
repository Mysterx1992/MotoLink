name: Publish MotoLink V1.6 vc27 official

on:
  push:
    branches:
      - "release/v1.6-vc27"
    paths:
      - ".github/workflows/publish-v16-vc27-official.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout frozen vc27 source
        uses: actions/checkout@v4
        with:
          ref: release/v1.6-vc27
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore official MotoLink keystore from GitHub secret
        id: signing
        env:
          MOTOLINK_KEYSTORE_B64: ${{ secrets.MOTOLINK_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOTOLINK_KEYSTORE_B64"
          KEYSTORE="$RUNNER_TEMP/MotoLink_Release_Keystore.jks"
          printf '%s' "$MOTOLINK_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "keystore_path=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Verify frozen vc27 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 27' app/build.gradle.kts
          grep -F 'versionName = "1.6"' app/build.gradle.kts
          grep -F 'private fun isBikeRecoveryTransportAlive()' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -F 'pxcAlive || managedAlive || (endpointCached && defaultWifiAlive)' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -F 'if (projection == null || !projectionReadyForProximity)' app/src/main/java/it/motolink/app/MirrorService.kt
          test -f docs/FROZEN_BASELINE_V1.6_VC27.md

      - name: Build unsigned V1.6 vc27
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          rm -rf app/build
          ./gradlew assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify official MotoLink identity
        env:
          MOTOLINK_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          MOTOLINK_KEYSTORE_PASSWORD: ${{ secrets.MOTOLINK_KEYSTORE_PASSWORD }}
          MOTOLINK_KEY_ALIAS: ${{ secrets.MOTOLINK_KEY_ALIAS }}
          MOTOLINK_KEY_PASSWORD: ${{ secrets.MOTOLINK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOTOLINK_KEYSTORE_PASSWORD"
          test -n "$MOTOLINK_KEY_ALIAS"
          test -n "$MOTOLINK_KEY_PASSWORD"

          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/MotoLink_V1.6_vc27_aligned.apk"
          APK="MotoLink_V1.6_VC27_EASYCONN_POCKETMODE_BUGFIX_OFFICIAL_SIGNED.apk"

          "$BT/aapt2" dump badging "$UNSIGNED" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='it.motolink.app' versionCode='27' versionName='1.6'" "$RUNNER_TEMP/badging.txt"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          export MOTOLINK_KS_PASS="$MOTOLINK_KEYSTORE_PASSWORD"
          export MOTOLINK_KEY_PASS="$MOTOLINK_KEY_PASSWORD"
          "$BT/apksigner" sign \
            --ks "$MOTOLINK_KEYSTORE_PATH" \
            --ks-key-alias "$MOTOLINK_KEY_ALIAS" \
            --ks-pass env:MOTOLINK_KS_PASS \
            --key-pass env:MOTOLINK_KEY_PASS \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" \
            "$ALIGNED"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Fi "Signer #1 certificate SHA-256 digest: 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100" "$RUNNER_TEMP/apksigner.txt"
          "$BT/aapt2" dump badging "$APK" | grep -F "package: name='it.motolink.app' versionCode='27' versionName='1.6'"
          sha256sum "$APK" | tee SHA256SUMS_V1.6_VC27.txt

      - name: Publish stable V1.6 vc27
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="MotoLink_V1.6_VC27_EASYCONN_POCKETMODE_BUGFIX_OFFICIAL_SIGNED.apk"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"

          cp docs/RELEASE_NOTES_V1.6.md "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo "## APK ufficiale vc27"
            echo
            echo "File: $APK"
            echo "SHA-256: $SHA"
            echo "Certificato MotoLink SHA-256: 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100"
          } >> "$RUNNER_TEMP/release-notes.md"

          git tag -f v1.6 "$GITHUB_SHA"
          git push --force origin refs/tags/v1.6

          gh release upload v1.6 "$APK" SHA256SUMS_V1.6_VC27.txt --clobber
          gh release edit v1.6 \
            --draft=false \
            --prerelease=false \
            --title "MotoLink V1.6 vc27" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target release/v1.6-vc27

          gh release delete-asset v1.6 MotoLink_V1.6_VC22_PROXIMITY_HOTFIX_OFFICIAL_SIGNED.apk -y || true
          gh release delete-asset v1.6 SHA256SUMS_V1.6_VC22.txt -y || true

      - name: Destroy temporary keystore
        if: always()
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/MotoLink_Release_Keystore.jks"
          if [ -f "$KEYSTORE" ]; then
            shred -u "$KEYSTORE" 2>/dev/null || rm -f "$KEYSTORE"
          fi
