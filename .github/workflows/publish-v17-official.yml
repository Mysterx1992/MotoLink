name: Publish MotoLink 1.7 official

on:
  push:
    branches:
      - "release/v1.7"
    paths:
      - ".github/workflows/publish-v17-official.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1.7 release source
        uses: actions/checkout@v4

      - name: Download validated unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v17"
          gh run download 37821966866             -R Mysterx1992/MotoLink             -n MotoLink_V1.7_FINAL_UNSIGNED             -D "$RUNNER_TEMP/v17"
          test -s "$RUNNER_TEMP/v17/MotoLink_V1.7_FINAL_ALIGNED_UNSIGNED.apk"
          test -s "$RUNNER_TEMP/v17/apksigner.jar"

      - name: Reconstruct exact official signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import io, struct, zipfile, zlib, hashlib

          ub = Path(__import__('os').environ['RUNNER_TEMP'] + '/v17/MotoLink_V1.7_FINAL_ALIGNED_UNSIGNED.apk').read_bytes()
          nums = Path('.github/release/v17-sign-structure.dec').read_text(encoding='utf-8').strip()
          packed = bytes(int(x) for x in nums.split(',') if x)
          p = zlib.decompress(packed)
          assert p[:5] == b'MLSP2'
          pos = 5
          count, changed_count = struct.unpack_from('<II', p, pos)
          pos += 8
          changed = {}
          for _ in range(changed_count):
              idx, length = struct.unpack_from('<II', p, pos)
              pos += 8
              changed[idx] = p[pos:pos+length]
              pos += length
          tail_len = struct.unpack_from('<I', p, pos)[0]
          pos += 4
          tail = p[pos:pos+tail_len]

          z = zipfile.ZipFile(io.BytesIO(ub))
          infos = z.infolist()
          assert len(infos) == count

          def header_and_dataoff(blob, zi):
              off = zi.header_offset
              vals = struct.unpack_from('<4s5H3L2H', blob, off)
              nlen, xlen = vals[-2], vals[-1]
              dataoff = off + 30 + nlen + xlen
              return blob[off:dataoff], dataoff

          eocd = ub.rfind(b'PK\x05\x06')
          assert eocd >= 0
          u_cd = struct.unpack_from('<4s4H2LH', ub, eocd)[6]

          out = bytearray()
          for i, zi in enumerate(infos):
              header, dataoff = header_and_dataoff(ub, zi)
              next_off = infos[i+1].header_offset if i + 1 < len(infos) else u_cd
              out += changed.get(i, header)
              out += ub[dataoff:next_off]
          out += tail

          apk = Path('MotoLink_V1.7.apk')
          apk.write_bytes(out)
          sha = hashlib.sha256(out).hexdigest()
          expected = '4f30e09d63c75450b136b75665e5c876276417ff1363160aa16f50ac5ece1b86'
          assert sha == expected, (sha, expected)
          Path('MotoLink_V1.7_SHA256.txt').write_text(f'{sha}  MotoLink_V1.7.apk\n', encoding='utf-8')
          PY

      - name: Verify official identity
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/v17/apksigner.jar" verify --verbose --print-certs MotoLink_V1.7.apk | tee verify.txt
          grep -Fi "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          grep -Fi "Signer #1 certificate SHA-256 digest: 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100" verify.txt
          grep -F "package: name='it.motolink.app' versionCode='30' versionName='1.7'" "$RUNNER_TEMP/v17/badging.txt"
          sha256sum -c MotoLink_V1.7_SHA256.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # MotoLink V1.7

          - Interfaccia automatica secondo la lingua del telefono.
          - Traduzioni complete: Italiano, English, Русский e 中文; fallback inglese per le altre lingue.
          - Guida iniziale e avviso di sicurezza tradotti.
          - Google Maps riconosce le notifiche russe, incluse unità cirilliche м/км, spazi Unicode, tempi e principali manovre testuali.
          - Migliorata la navigazione BLE turn-by-turn sui telefoni in russo, inclusa VOGE Valico 625 DSX.
          - Recovery TFT/EasyConn vc28 e Modalità tasca preservati.
          EOF

          if gh release view v1.7 -R Mysterx1992/MotoLink >/dev/null 2>&1; then
            gh release edit v1.7               -R Mysterx1992/MotoLink               --title "MotoLink V1.7"               --notes-file "$RUNNER_TEMP/release-notes.md"               --target release/v1.7               --latest
          else
            gh release create v1.7               -R Mysterx1992/MotoLink               --target release/v1.7               --title "MotoLink V1.7"               --notes-file "$RUNNER_TEMP/release-notes.md"               --latest
          fi

          gh release upload v1.7             -R Mysterx1992/MotoLink             MotoLink_V1.7.apk MotoLink_V1.7_SHA256.txt             --clobber

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.7_OFFICIAL_SIGNED
          path: |
            MotoLink_V1.7.apk
            MotoLink_V1.7_SHA256.txt
            verify.txt
          if-no-files-found: error
          retention-days: 14
