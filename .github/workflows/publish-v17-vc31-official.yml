name: Publish MotoLink 1.7 vc31 Official

on:
  push:
    branches: [ "release/v1.7-maps-roundabout-hotfix" ]
    paths:
      - ".github/workflows/publish-v17-vc31-official.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Download validated unsigned artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v17"
          gh run download 37837177372             -R Mysterx1992/MotoLink             -n MotoLink_V1.7_VC31_MAPS_ROUNDABOUT_UNSIGNED             -D "$RUNNER_TEMP/v17"
          test -s "$RUNNER_TEMP/v17/MotoLink_V1.7_VC31_ALIGNED_UNSIGNED.apk"
          test -s "$RUNNER_TEMP/v17/apksigner.jar"
          grep -F "package: name='it.motolink.app' versionCode='31' versionName='1.7'" "$RUNNER_TEMP/v17/badging.txt"

      - name: Reconstruct exact official signed APK
        shell: bash
        run: |
          set -euo pipefail
          cat .github/release/v17vc31/chunk*.b64 > "$RUNNER_TEMP/reconstruct.b64"
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, os, struct, zipfile, zlib, hashlib

          root=Path(os.environ["RUNNER_TEMP"])/"v17"
          unsigned=(root/"MotoLink_V1.7_VC31_ALIGNED_UNSIGNED.apk").read_bytes()
          payload=zlib.decompress(base64.b64decode((Path(os.environ["RUNNER_TEMP"])/"reconstruct.b64").read_bytes()))
          if payload[:4] != b"MLS4":
              raise SystemExit("bad reconstruction payload")
          pos=4
          count=struct.unpack_from("<I",payload,pos)[0]; pos+=4
          meta=[]
          for _ in range(count):
              lh,lg=struct.unpack_from("<II",payload,pos); pos+=8
              header=payload[pos:pos+lh]; pos+=lh
              gap=payload[pos:pos+lg]; pos+=lg
              meta.append((header,gap))
          tail_len=struct.unpack_from("<I",payload,pos)[0]; pos+=4
          tail=payload[pos:pos+tail_len]

          z=zipfile.ZipFile(io.BytesIO(unsigned))
          infos=z.infolist()
          if len(infos) != count:
              raise SystemExit(f"entry count mismatch {len(infos)} != {count}")

          def local_data_offset(blob, zi):
              off=zi.header_offset
              vals=struct.unpack_from("<4s5H3L2H",blob,off)
              nlen,xlen=vals[-2],vals[-1]
              return off+30+nlen+xlen

          out=bytearray()
          for idx,zi in enumerate(infos):
              dataoff=local_data_offset(unsigned,zi)
              header,gap=meta[idx]
              out += header
              out += unsigned[dataoff:dataoff+zi.compress_size]
              out += gap
          out += tail

          apk=Path("MotoLink_V1.7.apk")
          apk.write_bytes(out)
          sha=hashlib.sha256(out).hexdigest()
          expected="b0b1396176d4094d2042a52ba42c313fa0a527b0e2851e9d194f43a6ecd4a726"
          if sha != expected:
              raise SystemExit(f"SHA mismatch {sha}")
          Path("MotoLink_V1.7_SHA256.txt").write_text(f"{sha}  MotoLink_V1.7.apk\n",encoding="utf-8")
          PY

      - name: Verify package and official MotoLink certificate
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/v17/apksigner.jar" verify --verbose --print-certs MotoLink_V1.7.apk | tee verify.txt
          grep -Fi "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          grep -Fi "Signer #1 certificate SHA-256 digest: 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100" verify.txt
          sha256sum -c MotoLink_V1.7_SHA256.txt
          grep -F "package: name='it.motolink.app' versionCode='31' versionName='1.7'" "$RUNNER_TEMP/v17/badging.txt"

      - name: Replace V1.7 GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          # MotoLink V1.7

          Aggiornamento V1.7 · versionCode 31.

          - Reader Google Maps esteso a EXTRA_TEXT_LINES, content/big/heads-up RemoteViews e accessibility text.
          - Migliorata l'estrazione della distanza alla prossima manovra, incluse notifiche Google Maps in russo.
          - Rotonde migliorate per tutte le lingue con riconoscimento visivo indipendente dalla lingua.
          - Classificatore icone normalizzato rispetto al tema/colore Android.
          - Codifica VOGE rotonde con roadFlag=4, settore annular e direzione d'uscita.
          - Diagnostica Maps privacy-safe senza strade o destinazioni.
          - BLE, heartbeat, EasyConn recovery, MediaProjection/H264 e Modalità tasca invariati.
          EOF
          gh release edit v1.7             -R Mysterx1992/MotoLink             --title "MotoLink V1.7"             --notes-file "$RUNNER_TEMP/notes.md"             --target release/v1.7-maps-roundabout-hotfix             --latest
          gh release upload v1.7             -R Mysterx1992/MotoLink             MotoLink_V1.7.apk MotoLink_V1.7_SHA256.txt             --clobber

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.7_VC31_OFFICIAL_SIGNED
          path: |
            MotoLink_V1.7.apk
            MotoLink_V1.7_SHA256.txt
            verify.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
