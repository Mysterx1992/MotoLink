name: Publish MotoLink V1.6 vc29 i18n test

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-vc29-i18n-test.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact validated vc29 tester artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vc29"
          gh run download 37811547388             -R Mysterx1992/MotoLink             -n MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE             -D "$RUNNER_TEMP/vc29"
          test -f "$RUNNER_TEMP/vc29/MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE.apk"
          echo "04b203435cbe9170814c488931d5f339e6958a4fb039096abf4fd3d145c9dbde  $RUNNER_TEMP/vc29/MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE.apk" | sha256sum -c -

      - name: Prepare public checksum and notes
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/vc29/MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE.apk"
          sha256sum "$APK" | sed "s|$RUNNER_TEMP/vc29/||" > "$RUNNER_TEMP/vc29/SHA256SUMS_VC29_TEST.txt"
          cat > "$RUNNER_TEMP/vc29/RELEASE_NOTES.md" <<'EOF'
          # MotoLink V1.6 vc29 TEST — i18n + Russian Maps

          Build di prova separata dalla MotoLink ufficiale, pensata per validare la VOGE Valico 625 e i telefoni con lingua russa.

          ## Novità
          - UI automatica secondo la lingua del telefono.
          - Traduzioni incluse: Italiano, English, Русский, 中文.
          - Fallback English per lingue non ancora tradotte.
          - Parser Google Maps aggiornato per notifiche russe:
            - unità cirilliche `м` e `км`;
            - spazi Unicode / NBSP;
            - manovre testuali russe;
            - tempi in russo.
          - BLE VOGE 625 invariato.

          ## Identità TEST
          - package: `it.motolink.app.test`
          - versionName: `1.6-test-vc29-i18n`
          - versionCode: `29`
          - si installa accanto a MotoLink ufficiale e non la sostituisce.

          ## Test richiesto
          Concedere Bluetooth / Dispositivi nelle vicinanze e accesso notifiche a **MotoLink TEST navigazione**, quindi avviare una rotta Google Maps e condividere il Log MotoLink TEST.

          ## SHA-256
          `04b203435cbe9170814c488931d5f339e6958a4fb039096abf4fd3d145c9dbde`

          Questa è una **pre-release di test**, non sostituisce la release stabile MotoLink V1.6.
          EOF

      - name: Publish vc29 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.6-vc29-i18n-test"
          APK="$RUNNER_TEMP/vc29/MotoLink_V1.6_TEST_VC29_I18N_RUSSIAN_MAPS_SIDE_BY_SIDE.apk"
          SUM="$RUNNER_TEMP/vc29/SHA256SUMS_VC29_TEST.txt"
          NOTES="$RUNNER_TEMP/vc29/RELEASE_NOTES.md"

          if gh release view "$TAG" -R Mysterx1992/MotoLink >/dev/null 2>&1; then
            gh release edit "$TAG"               -R Mysterx1992/MotoLink               --title "MotoLink V1.6 vc29 TEST — i18n + Russian Maps"               --notes-file "$NOTES"               --prerelease               --target test/v1.6-vc29-i18n-side-by-side
          else
            gh release create "$TAG"               -R Mysterx1992/MotoLink               --title "MotoLink V1.6 vc29 TEST — i18n + Russian Maps"               --notes-file "$NOTES"               --prerelease               --target test/v1.6-vc29-i18n-side-by-side
          fi

          gh release upload "$TAG"             -R Mysterx1992/MotoLink             "$APK" "$SUM"             --clobber
