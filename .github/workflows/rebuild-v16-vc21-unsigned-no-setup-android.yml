name: Verify exact MotoLink V1.6 vc21 signed reconstruction

on:
  push:
    branches: [ "ops/rebuild-v16-vc21-unsigned-20260916" ]

permissions:
  contents: read

jobs:
  verify-exact-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK and install exact components
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize exact vc20 source lineage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/build-v16-vc20-zero-transition-guard.yml').read_text(encoding='utf-8')
          names = ['Materialize exact vc19 source lineage','Apply vc20 zero transition guard']
          out = []
          for name in names:
              marker = f'      - name: {name}\n        run: |\n'
              if workflow.count(marker) != 1:
                  raise SystemExit(f'VC21 lineage extraction FAIL {name}: count={workflow.count(marker)}')
              start = workflow.index(marker) + len(marker)
              end = workflow.find('\n      - name:', start)
              if end < 0:
                  raise SystemExit(f'VC21 lineage extraction FAIL {name}: next step not found')
              block = workflow[start:end]
              for line in block.splitlines():
                  if line.startswith('          '): out.append(line[10:])
                  elif line.strip() == '': out.append('')
                  else: raise SystemExit(f'unexpected indentation {line!r}')
              out.append('')
          Path('/tmp/materialize_vc20.sh').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          bash /tmp/materialize_vc20.sh

      - name: Apply exact vc21 patch and version bump
        run: |
          set -euo pipefail
          python3 tools/apply_v16_vc21_route_remaining_distance.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          if s.count('versionCode = 20') != 1:
              raise SystemExit('versionCode 20 not unique')
          p.write_text(s.replace('versionCode = 20', 'versionCode = 21', 1), encoding='utf-8')
          PY

      - name: Compile vc21 unsigned payloads
        run: ./gradlew assembleRelease --stacktrace

      - name: Reconstruct exact frozen signed APK
        run: |
          set -euo pipefail
          mkdir -p out
          cat .github/release-assets/v1.6/vc21-blueprint.b64.part* | base64 -d > /tmp/vc21-blueprint.mlbp.xz
          echo "2280c98db7a1e1d7721a7923aea05639892efa63db298672f5b4fc3b6982149d  /tmp/vc21-blueprint.mlbp.xz" | sha256sum -c -
          python3 .github/release-assets/v1.6/reconstruct_signed_apk.py \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/vc21-blueprint.mlbp.xz \
            out/MotoLink_V1.6.apk
          echo "cedba0a0f8cc9beacacbf8c8c85258a72bb89223061511f75b298bfc120b3f9e  out/MotoLink_V1.6.apk" | sha256sum -c -

      - name: Verify package, version and MotoLink signing certificate
        run: |
          set -euo pipefail
          APK=out/MotoLink_V1.6.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='it.motolink.app' versionCode='21' versionName='1.6'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fi "Signer #1 certificate SHA-256 digest: 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100" /tmp/apksigner.txt

      - name: Upload exact verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink-V1.6-vc21-EXACT-SIGNED-VERIFIED
          path: out/MotoLink_V1.6.apk
          if-no-files-found: error
          retention-days: 1
