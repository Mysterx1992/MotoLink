name: Repair homepage MotoLink V1.7 download badge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-homepage-download-badge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate fresh RGB badge and update the homepage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          w,h = 520,72
          image = Image.new("RGB",(w,h),"#0d1117")
          d = ImageDraw.Draw(image)
          d.rounded_rectangle((1,1,w-2,h-2),radius=12,fill="#30343c",outline="#53575f",width=2)
          d.rounded_rectangle((398,1,w-2,h-2),radius=12,fill="#22d76c")
          d.rectangle((398,1,412,h-2),fill="#22d76c")
          d.line((398,6,398,h-7),fill="#566068",width=2)
          font_path="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font=ImageFont.truetype(font_path,25)
          version=ImageFont.truetype(font_path,26)
          d.line((36,15,36,42),fill="white",width=5)
          d.line((24,34,36,46,48,34),fill="white",width=5,joint="curve")
          d.line((23,50,49,50),fill="white",width=4)
          d.text((64,20),"SCARICA MOTOLINK",fill="#ffffff",font=font)
          d.text((422,19),"V1.7",fill="#071f11",font=version)
          target=Path("docs/images/download-motolink-v17-rgb.png")
          image.save(target,format="PNG",optimize=True)
          with Image.open(target) as verify:
              verify.load()
              assert verify.mode == "RGB" and verify.size == (w,h)
          readme=Path("README.md")
          original=readme.read_text(encoding="utf-8")
          old='src="docs/images/download-motolink-v17.png"'
          new='src="docs/images/download-motolink-v17-rgb.png"'
          if old not in original:
              raise RuntimeError("README badge reference changed; refusing to replace unexpectedly")
          readme.write_text(original.replace(old,new), encoding="utf-8")
          print(f"VERIFIED badge: truecolor PNG {w}x{h}, {target.stat().st_size} bytes")
          PY
      - name: Commit decoded and verified badge with homepage update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/images/download-motolink-v17-rgb.png
          git commit -m "fix: restore fully visible V1.7 direct-download badge"
          git push origin HEAD:main
