name: Build MotoLink Trofeo 500 WiFi recovery laboratory APK

on:
  push:
    branches: ["lab/trofeo500-wifi-recovery-app-20261019"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile installable WiFi recovery APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble experimental debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verify separate package and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MotoLink_V1.7_Trofeo500_RipristinoWiFi_LAB.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/MotoLink_V1.7_Trofeo500_RipristinoWiFi_LAB.apk | tee dist/APK_INFO.txt
          grep -q "package: name='it.motolink.app.recoverylab'" dist/APK_INFO.txt
          grep -q "versionCode='33'" dist/APK_INFO.txt
          sha256sum dist/MotoLink_V1.7_Trofeo500_RipristinoWiFi_LAB.apk | tee dist/SHA256.txt
      - name: Upload APK as temporary Actions artifact only
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1_7_Trofeo500_RipristinoWiFi_LAB
          path: dist/
          retention-days: 30
          if-no-files-found: error
