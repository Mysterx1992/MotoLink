name: MotoLink V1.5 materialize source

on:
  push:
    branches: [ "release/v1.5" ]
    paths: [ ".github/workflows/v15-materialize-source.yml" ]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Start V1.5 source materialization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore V1.5 tested patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v15-temp-apk-build.yml').read_text()
          start=p.index('      - name: Apply V1.5 build-only fixes')
          end=p.index('      - name: Build release APK', start)
          block=p[start:end]
          marker='        run: |\n'
          i=block.index(marker)+len(marker)
          lines=[]
          for line in block[i:].splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip():
                  break
          Path('/tmp/apply_v15_patch.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/apply_v15_patch.sh

      - name: V1.5 source gates
        shell: bash
        run: |
          grep -R 'versionName = "1.5"' app/build.gradle.kts
          grep -R 'versionCode = 9' app/build.gradle.kts
          ! grep -RniE 'MOTO[- ]?HUB|MotoHub' app --exclude-dir=build
          ! grep -RniE 'YOUR_PROJECT_REF|REPLACE_ME' app --exclude-dir=build
          git diff --check

      - name: Compile V1.5 source
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Commit tested V1.5 source
        shell: bash
        run: |
          git config user.name "Mysterx1992"
          git config user.email "scarano.emanuele@hotmail.com"
          git add app
          git status --short
          git diff --cached --quiet && { echo 'No app source changes to commit'; exit 1; }
          git commit -m "MotoLink V1.5 source"
          git push origin HEAD:release/v1.5
