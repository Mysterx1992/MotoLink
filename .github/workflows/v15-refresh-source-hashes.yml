name: MotoLink V1.5 refresh source checksums

on:
  push:
    branches: [ "release/v1.5" ]
    paths: [ ".github/workflows/v15-refresh-source-hashes.yml" ]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh V1.5 source checksums'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recompute checksums for frozen source file list
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/SOURCE_SHA256SUMS.txt
          while read -r hash path; do
            test -f "$path"
            sha256sum "$path" >> /tmp/SOURCE_SHA256SUMS.txt
          done < SOURCE_SHA256SUMS.txt
          mv /tmp/SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.txt
          git diff --check
      - name: Commit refreshed checksums
        shell: bash
        run: |
          git config user.name "Mysterx1992"
          git config user.email "scarano.emanuele@hotmail.com"
          git add SOURCE_SHA256SUMS.txt
          git diff --cached --quiet && { echo 'Checksums already current'; exit 0; }
          git commit -m "Refresh MotoLink V1.5 source checksums"
          git push origin HEAD:release/v1.5
