name: MotoLink V1.5 temporary APK build fixed

on:
  push:
    branches: [ "v1.5-apk-build-temp" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - name: Restore V1.5 build-only patch from previous temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v15-temp-apk-build.yml').read_text()
          start=p.index('      - name: Apply V1.5 build-only fixes')
          end=p.index('      - name: Build release APK', start)
          block=p[start:end]
          marker='        run: |\n'
          i=block.index(marker)+len(marker)
          lines=[]
          for line in block[i:].splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip():
                  break
          Path('/tmp/apply_previous_patch.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/apply_previous_patch.sh
      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Package unsigned candidate
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk MotoLink_V1.5_UNSIGNED.apk
          sha256sum MotoLink_V1.5_UNSIGNED.apk
      - name: Upload V1.5 unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.5_UNSIGNED
          path: MotoLink_V1.5_UNSIGNED.apk
          if-no-files-found: error
