name: MotoLink V1.5 temporary APK build

on:
  push:
    branches: [ "v1.5-apk-build-temp" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools"
      - name: Apply V1.5 build-only fixes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_v15.py
          python3 /tmp/apply_v15.py
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Package unsigned candidate
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk MotoLink_V1.5_UNSIGNED.apk
          sha256sum MotoLink_V1.5_UNSIGNED.apk
          test -s MotoLink_V1.5_UNSIGNED.apk
          if unzip -p MotoLink_V1.5_UNSIGNED.apk resources.arsc | strings | grep -E 'YOUR_PROJECT_REF|REPLACE_ME'; then exit 1; fi
      - name: Upload V1.5 unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.5_UNSIGNED
          path: MotoLink_V1.5_UNSIGNED.apk
          if-no-files-found: error
