name: MotoLink V1.5.1 temporary APK build 2

on:
  push:
    branches: [ "v1.5.1-apk-build-temp" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned V1.5.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply V1.5.1 hotfix in runner only
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_v151.py
          python3 /tmp/apply_v151.py
          grep -q 'versionName = "1.5.1"' app/build.gradle.kts
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'PROX V1.5.1 READY' app/src/main/java/it/motolink/app/MirrorService.kt
          grep -q 'ANTI AUTO-LOCK V1.5.1' app/src/main/java/it/motolink/app/MirrorService.kt
          grep -q 'Release v\$version' app/src/main/java/it/motolink/app/MainActivity.kt
          ! grep -n -E 'YOUR_PROJECT_REF|REPLACE_ME' app/src/main/res/values/ai_config.xml || (echo 'IA config placeholder found' && exit 1)
          ! grep -R -n -E 'MOTO-HUB|MOTO HUB|MotoHub' app/src/main || (echo 'Forbidden external reference found' && exit 1)

      - name: Build release APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/MotoLink_V1.5.1_UNSIGNED.apk
          sha256sum out/MotoLink_V1.5.1_UNSIGNED.apk | tee out/SHA256.txt

      - name: Upload unsigned V1.5.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.5.1_UNSIGNED
          path: out/*
          if-no-files-found: error
          retention-days: 2
