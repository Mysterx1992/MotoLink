name: MotoLink vc23 PayPal test build

on:
  push:
    branches:
      - "test/v1.6-vc23-paypal-donations"
    paths:
      - ".github/workflows/vc23-paypal-test-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vc23 test source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify vc23 PayPal test scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 23' app/build.gradle.kts
          grep -F 'versionName = "1.6-vc23-test"' app/build.gradle.kts
          grep -F 'https://www.paypal.com/donate/?hosted_button_id=N7BM2VCKWWKNN' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -F 'Sostieni MotoLink con PayPal' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt

      - name: Build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload temporary unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: motolink-vc23-paypal-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
