name: MotoLink vc23 PayPal test sign

on:
  push:
    branches:
      - "test/v1.6-vc23-paypal-donations"
    paths:
      - ".github/workflows/vc23-paypal-test-sign.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout vc23 test source
        uses: actions/checkout@v4
        with:
          ref: test/v1.6-vc23-paypal-donations
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate one-time signing handoff certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/signing-handoff
          openssl req -x509 -newkey rsa:4096 -nodes             -keyout "$RUNNER_TEMP/vc23-handoff-private.pem"             -out .github/signing-handoff/vc23-paypal-public-cert.pem             -subj "/CN=MotoLink-vc23-paypal-one-time-handoff"             -days 1
          chmod 600 "$RUNNER_TEMP/vc23-handoff-private.pem"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/signing-handoff/vc23-paypal-public-cert.pem
          git commit -m "Publish one-time vc23 signing handoff certificate"
          git push origin HEAD:test/v1.6-vc23-paypal-donations

      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=".github/signing-handoff/vc23-paypal-signing.cms.b64"
          for i in $(seq 1 90); do
            git fetch origin test/v1.6-vc23-paypal-donations
            if git cat-file -e "origin/test/v1.6-vc23-paypal-donations:$PAYLOAD" 2>/dev/null; then
              git show "origin/test/v1.6-vc23-paypal-donations:$PAYLOAD" > "$RUNNER_TEMP/signing.cms.b64"
              echo "Encrypted signing payload received."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for encrypted signing payload." >&2
          exit 1

      - name: Decrypt signing backup on runner
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/signing.cms.b64" > "$RUNNER_TEMP/signing.cms"
          openssl cms -decrypt -inform DER             -in "$RUNNER_TEMP/signing.cms"             -recip .github/signing-handoff/vc23-paypal-public-cert.pem             -inkey "$RUNNER_TEMP/vc23-handoff-private.pem"             -out "$RUNNER_TEMP/signing-backup.zip"
          mkdir -p "$RUNNER_TEMP/signing"
          unzip -q "$RUNNER_TEMP/signing-backup.zip" -d "$RUNNER_TEMP/signing"
          test -s "$RUNNER_TEMP/signing/MotoLink_Release_Keystore.jks"
          test -s "$RUNNER_TEMP/signing/GITHUB_SECRETS.txt"

      - name: Load signing credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'signing' / 'GITHUB_SECRETS.txt'
          values = {}
          for raw in p.read_text(encoding='utf-8').splitlines():
              if '=' not in raw or raw.lstrip().startswith('#'):
                  continue
              k, v = raw.split('=', 1)
              k = k.strip()
              if k in {'MOTOLINK_KEYSTORE_PASSWORD','MOTOLINK_KEY_ALIAS','MOTOLINK_KEY_PASSWORD'}:
                  values[k] = v.strip()
          required = {'MOTOLINK_KEYSTORE_PASSWORD','MOTOLINK_KEY_ALIAS','MOTOLINK_KEY_PASSWORD'}
          if required - values.keys():
              raise SystemExit('Missing required signing fields')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for k, v in values.items():
                  print(f'::add-mask::{v}')
                  f.write(f'{k}={v}\n')
          PY

      - name: Build exact vc23 test release
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 23' app/build.gradle.kts
          grep -F 'versionName = "1.6-vc23-test"' app/build.gradle.kts
          grep -F 'https://www.paypal.com/donate/?hosted_button_id=N7BM2VCKWWKNN' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -F 'Sostieni MotoLink con PayPal' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          rm -rf app/build
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify official MotoLink identity
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/MotoLink_vc23_paypal_aligned.apk"
          APK="MotoLink_V1.6_VC23_PAYPAL_DONATION_TEST_OFFICIAL_SIGNED.apk"
          KS="$RUNNER_TEMP/signing/MotoLink_Release_Keystore.jks"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          export MOTOLINK_KS_PASS="$MOTOLINK_KEYSTORE_PASSWORD"
          export MOTOLINK_KEY_PASS="$MOTOLINK_KEY_PASSWORD"
          "$BT/apksigner" sign             --ks "$KS"             --ks-key-alias "$MOTOLINK_KEY_ALIAS"             --ks-pass env:MOTOLINK_KS_PASS             --key-pass env:MOTOLINK_KEY_PASS             --v1-signing-enabled false             --v2-signing-enabled true             --v3-signing-enabled true             --out "$APK"             "$ALIGNED"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Fi "Signer #1 certificate SHA-256 digest: 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100" "$RUNNER_TEMP/apksigner.txt"
          "$BT/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='it.motolink.app' versionCode='23' versionName='1.6-vc23-test'" "$RUNNER_TEMP/badging.txt"
          sha256sum "$APK" | tee VC23_SHA256.txt

      - name: Upload temporary signed APK
        uses: actions/upload-artifact@v4
        with:
          name: motolink-vc23-paypal-official-signed
          path: |
            MotoLink_V1.6_VC23_PAYPAL_DONATION_TEST_OFFICIAL_SIGNED.apk
            VC23_SHA256.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cleanup sensitive temporary material
        if: always()
        shell: bash
        run: |
          set +e
          for f in             "$RUNNER_TEMP/vc23-handoff-private.pem"             "$RUNNER_TEMP/signing.cms.b64"             "$RUNNER_TEMP/signing.cms"             "$RUNNER_TEMP/signing-backup.zip"             "$RUNNER_TEMP/signing/MotoLink_Release_Keystore.jks"             "$RUNNER_TEMP/signing/GITHUB_SECRETS.txt"; do
            if [ -f "$f" ]; then shred -u "$f" 2>/dev/null || rm -f "$f"; fi
          done
          rm -rf "$RUNNER_TEMP/signing"
