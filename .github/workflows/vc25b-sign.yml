name: MotoLink V1.6 vc25 final sign

on:
  push:
    branches:
      - "test/v1.6-vc23-paypal-donations"
    paths:
      - ".github/workflows/vc25b-sign.yml"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/v1.6-vc23-paypal-donations
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - name: Ephemeral handoff key
        run: |
          set -euo pipefail
          mkdir -p .github/handoff
          openssl req -x509 -newkey rsa:4096 -nodes -days 1             -subj "/CN=MotoLink-vc25-final-one-time"             -keyout "$RUNNER_TEMP/handoff-key.pem"             -out .github/handoff/vc25b-cert.pem
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/handoff/vc25b-cert.pem
          git commit -m "vc25 final one-time handoff certificate"
          git push origin HEAD:test/v1.6-vc23-paypal-donations
      - name: Wait for handoff package
        run: |
          set -euo pipefail
          P=.github/handoff/vc25b-material.cms.b64
          for i in $(seq 1 90); do
            git fetch origin test/v1.6-vc23-paypal-donations
            if git cat-file -e "origin/test/v1.6-vc23-paypal-donations:$P" 2>/dev/null; then
              git show "origin/test/v1.6-vc23-paypal-donations:$P" > "$RUNNER_TEMP/material.cms.b64"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Open handoff package
        run: |
          set -euo pipefail
          base64 -d "$RUNNER_TEMP/material.cms.b64" > "$RUNNER_TEMP/material.cms"
          openssl cms -decrypt -inform DER             -in "$RUNNER_TEMP/material.cms"             -recip .github/handoff/vc25b-cert.pem             -inkey "$RUNNER_TEMP/handoff-key.pem"             -out "$RUNNER_TEMP/material.zip"
          mkdir -p "$RUNNER_TEMP/material"
          unzip -q "$RUNNER_TEMP/material.zip" -d "$RUNNER_TEMP/material"
          set -a
          . "$RUNNER_TEMP/material/credentials.env"
          set +a
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASS"
          {
            echo "KS_PASS=$KS_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASS=$KEY_PASS"
          } >> "$GITHUB_ENV"
      - name: Verify source scope
        run: |
          set -euo pipefail
          grep -F 'versionCode = 25' app/build.gradle.kts
          grep -F 'versionName = "1.6"' app/build.gradle.kts
          grep -F 'title = "CREDITI · Donazioni"' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          grep -F 'payPalDonateButton(), lp(140f, 1260f, 663f, 90f)' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          grep -F 'btn_donateCC_LG.gif' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          grep -F 'N7BM2VCKWWKNN' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
      - name: Build
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          rm -rf app/build
          ./gradlew assembleRelease --stacktrace
      - name: Sign
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          IN="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          OUT="MotoLink_V1.6_VC25_PAYPAL_CREDITS_FINAL_OFFICIAL_SIGNED.apk"
          "$BT/zipalign" -p -f 4 "$IN" "$ALIGNED"
          "$BT/apksigner" sign             --ks "$RUNNER_TEMP/material/motolink.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass env:KS_PASS             --key-pass env:KEY_PASS             --v1-signing-enabled false             --v2-signing-enabled true             --v3-signing-enabled true             --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/verify.txt"
          grep -Fi "Signer #1 certificate SHA-256 digest: 9ae7bb26293441eb1bcea894774088a762e8eaecbf2a60297efadc20fc2a2100" "$RUNNER_TEMP/verify.txt"
          "$BT/aapt2" dump badging "$OUT" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='25' versionName='1.6'" "$RUNNER_TEMP/badging.txt"
          sha256sum "$OUT" | tee VC25_FINAL_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: motolink-vc25-final-official-signed
          path: |
            MotoLink_V1.6_VC25_PAYPAL_CREDITS_FINAL_OFFICIAL_SIGNED.apk
            VC25_FINAL_SHA256.txt
          retention-days: 1
          compression-level: 0
      - name: Local runner cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/material" "$RUNNER_TEMP/material.zip" "$RUNNER_TEMP/material.cms" "$RUNNER_TEMP/material.cms.b64" "$RUNNER_TEMP/handoff-key.pem"
