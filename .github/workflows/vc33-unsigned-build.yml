name: Build MotoLink V1.7 vc33 unsigned candidate

on:
  push:
    branches: ["feature/v17-vc33-ble-latest-wins-reconnect"]
    paths:
      - ".github/workflows/vc33-unsigned-build.yml"
      - "app/**"
      - "tools/vc33_ble_regression.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check frozen BLE transport contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vc33_ble_regression.py
      - name: Build unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Check APK and version
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$APK" | tee apk_badging.txt
          grep -q "package: name='it.motolink.app'" apk_badging.txt
          grep -q "versionCode='33'" apk_badging.txt
          grep -q "versionName='1.7'" apk_badging.txt
          sha256sum "$APK" | tee vc33_unsigned_sha256.txt
      - name: Upload candidate for separate private official signing
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1.7_VC33_UNSIGNED_CANDIDATE
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            vc33_unsigned_sha256.txt
            apk_badging.txt
          retention-days: 7
          if-no-files-found: error
